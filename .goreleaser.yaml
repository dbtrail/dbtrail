version: 2

# Pinned: without this, GoReleaser infers the project name from the repository,
# and renaming the repo (dbtrail/bintrail → dbtrail/dbtrail) would silently
# rename every release artifact. The `bintrail_<version>_<os>_<arch>.tar.gz`
# naming is a contract: the dbtrail SaaS deploy pipeline and published install
# instructions download tarballs by this exact pattern.
project_name: bintrail

builds:
  - id: bintrail
    binary: bintrail
    main: ./cmd/bintrail
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
      - -X main.BuildDate={{.Date}}
      # Telemetry ingestion endpoint (nethalo/dbtrail#1577). Empty in a plain
      # `go build`; official release binaries point at the metadata-only
      # ingestion host. bintrail-mcp is deliberately NOT instrumented.
      - -X github.com/dbtrail/dbtrail/internal/telemetry.endpoint=https://telemetry.dbtrail.com/

  - id: bintrail-mcp
    binary: bintrail-mcp
    main: ./cmd/bintrail-mcp
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
    ldflags:
      - -s -w
      - -X main.mcpVersion={{.Version}}
    # Package each bintrail-mcp binary as an MCP Bundle (.mcpb) — the Claude
    # Desktop one-click install format (#1040): a zip of manifest.json +
    # server/bintrail-mcp whose config form asks for the console URL + token
    # and runs the binary in `--connect` bridge mode. The script validates the
    # produced bundle (manifest fields, entry binary), so a malformed bundle
    # fails the release. Published via release.extra_files below.
    hooks:
      post:
        - cmd: bash scripts/build-mcpb.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" "{{ .Version }}"

  # bintrail-console links DuckDB (console → query → parquetquery), so it is
  # CGO like the core binary — and uses the SAME main.* ldflags var names, so
  # the version block mirrors bintrail's verbatim. Ships in the release
  # archives, as its own deb/rpm (nfpms below), and as its own image
  # (ghcr.io/dbtrail/bintrail-console — dockers/docker_manifests below).
  - id: bintrail-console
    binary: bintrail-console
    main: ./cmd/bintrail-console
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
      - -X main.BuildDate={{.Date}}
      # Telemetry ingestion endpoint (nethalo/dbtrail#1577). Empty in a plain
      # `go build`; official release binaries point at the metadata-only
      # ingestion host. bintrail-mcp is deliberately NOT instrumented.
      - -X github.com/dbtrail/dbtrail/internal/telemetry.endpoint=https://telemetry.dbtrail.com/

  # bintrail-pg: the PostgreSQL-source binary (#534). Build-identical to
  # bintrail-console — it links DuckDB via the shared read plane (CGO) plus the
  # pure-Go pgx/pglogrepl capture stack — so the CGO/cross-compile block and the
  # main.* ldflags var names mirror bintrail/bintrail-console verbatim. Ships in
  # the release archives, as its own deb/rpm (nfpms below), and as its own image
  # (ghcr.io/dbtrail/bintrail-pg — dockers/docker_manifests below).
  - id: bintrail-pg
    binary: bintrail-pg
    main: ./cmd/bintrail-pg
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
      - -X main.BuildDate={{.Date}}
      # Telemetry ingestion endpoint (nethalo/dbtrail#1577). Empty in a plain
      # `go build`; official release binaries point at the metadata-only
      # ingestion host. bintrail-mcp is deliberately NOT instrumented.
      - -X github.com/dbtrail/dbtrail/internal/telemetry.endpoint=https://telemetry.dbtrail.com/

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - bintrail
      - bintrail-mcp
      - bintrail-console
      - bintrail-pg
    # `files:` OVERRIDES GoReleaser's default set (LICENSE*/README*/CHANGELOG*),
    # so the defaults are re-listed here alongside the license-compliance
    # artifacts (#428): NOTICE + THIRD-PARTY-NOTICES carry the retained
    # upstream notices for the statically-linked MIT/MPL-2.0/BSD dependencies.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - NOTICE
      - THIRD-PARTY-NOTICES

checksum:
  name_template: "checksums.txt"
  # Include the .mcpb bundles (built by the bintrail-mcp post hook, published
  # via release.extra_files) in checksums.txt.
  extra_files:
    - glob: dist/mcpb/*.mcpb

# Auto-detect prereleases from the tag (e.g. v0.7.12-rc1) and mark the
# GitHub release "prerelease" so an RC never claims the "Latest" badge.
# Pairs with skip_push: auto on the :latest Docker manifest below.
release:
  prerelease: auto
  # .mcpb MCP Bundles (Claude Desktop one-click install) — produced by the
  # bintrail-mcp build post hook, one per platform in the build matrix.
  extra_files:
    - glob: dist/mcpb/*.mcpb

# ── Linux packages (deb/rpm) ───────────────────────────────
# Attached to the GitHub release as downloadable assets. No external
# repository required, unlike the Homebrew tap below.
nfpms:
  - id: bintrail
    package_name: bintrail
    ids:
      - bintrail
      - bintrail-mcp
    vendor: DBTrail
    homepage: https://github.com/dbtrail/dbtrail
    maintainer: Daniel <daniel@dbtrail.com>
    description: >-
      Parse MySQL ROW-format binary logs, index every row event with full
      before/after images, and generate reversal SQL for recovery.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - ca-certificates
    # License-compliance docs (#428): our own license + the retained upstream
    # notices for statically-linked deps, installed where distro tooling looks.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/bintrail/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/bintrail/NOTICE
      - src: THIRD-PARTY-NOTICES
        dst: /usr/share/doc/bintrail/THIRD-PARTY-NOTICES

  # Separate package, mirroring the binary split: the core CLI stays UI-free
  # and the web console installs only where an operator wants it.
  - id: bintrail-console
    package_name: bintrail-console
    ids:
      - bintrail-console
    vendor: DBTrail
    homepage: https://github.com/dbtrail/dbtrail
    maintainer: Daniel <daniel@dbtrail.com>
    description: >-
      Web console for the bintrail binlog index — read-only event browser,
      recovery SQL generation, and the combined stream+console watch daemon.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - ca-certificates
    # Same notices as the core package, under this package's own doc dir (#428).
    contents:
      - src: LICENSE
        dst: /usr/share/doc/bintrail-console/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/bintrail-console/NOTICE
      - src: THIRD-PARTY-NOTICES
        dst: /usr/share/doc/bintrail-console/THIRD-PARTY-NOTICES

  # Separate package for the PostgreSQL-source binary (#534), mirroring the
  # console split: a PostgreSQL operator installs only bintrail-pg.
  - id: bintrail-pg
    package_name: bintrail-pg
    ids:
      - bintrail-pg
    vendor: DBTrail
    homepage: https://github.com/dbtrail/dbtrail
    maintainer: Daniel <daniel@dbtrail.com>
    description: >-
      Capture a live PostgreSQL logical-replication stream into the bintrail
      MySQL index with full before/after images, and generate reversal SQL for
      recovery (PostgreSQL-source support is alpha).
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - ca-certificates
    # Same notices as the core package, under this package's own doc dir (#428).
    contents:
      - src: LICENSE
        dst: /usr/share/doc/bintrail-pg/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/bintrail-pg/NOTICE
      - src: THIRD-PARTY-NOTICES
        dst: /usr/share/doc/bintrail-pg/THIRD-PARTY-NOTICES

# ── Docker images (multi-arch, published to GHCR) ──────────
# One image per arch, then a manifest stitching them into a single
# multi-arch tag. The arm64 image's RUN step executes under QEMU on the
# amd64 CI runner, so the workflow sets up docker/setup-qemu-action.
# Per-arch images carry only the version tag. Both the :{version} and
# :latest manifests below reference these same arch images — a manifest only
# needs the per-arch images to exist in the registry, so there's no need for
# separate :latest-<arch> tags. This is what lets us gate :latest (see the
# skip_push on the latest manifest) without skipping the version push too.
dockers:
  - id: bintrail-amd64
    goos: linux
    goarch: amd64
    ids:
      - bintrail
      - bintrail-mcp
    dockerfile: build/Dockerfile.goreleaser
    use: buildx
    # Stage the license-compliance notices into the docker build context so the
    # Dockerfile's COPY can pick them up (#428).
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES
    image_templates:
      - "ghcr.io/dbtrail/bintrail:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/dbtrail/dbtrail"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: bintrail-arm64
    goos: linux
    goarch: arm64
    ids:
      - bintrail
      - bintrail-mcp
    dockerfile: build/Dockerfile.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES
    image_templates:
      - "ghcr.io/dbtrail/bintrail:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/dbtrail/dbtrail"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  # bintrail-console: its own single-binary image (PMM-style split — the
  # compose quickstart runs `bintrail-console watch` from this image).
  - id: bintrail-console-amd64
    goos: linux
    goarch: amd64
    ids:
      - bintrail-console
    dockerfile: build/Dockerfile.bintrail-console.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES
    image_templates:
      - "ghcr.io/dbtrail/bintrail-console:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=bintrail-console"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/dbtrail/dbtrail"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: bintrail-console-arm64
    goos: linux
    goarch: arm64
    ids:
      - bintrail-console
    dockerfile: build/Dockerfile.bintrail-console.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES
    image_templates:
      - "ghcr.io/dbtrail/bintrail-console:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=bintrail-console"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/dbtrail/dbtrail"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  # bintrail-pg: its own single-binary image (PMM-style split), same shape as
  # the bintrail-console image pair above.
  - id: bintrail-pg-amd64
    goos: linux
    goarch: amd64
    ids:
      - bintrail-pg
    dockerfile: build/Dockerfile.bintrail-pg.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES
    image_templates:
      - "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=bintrail-pg"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/dbtrail/dbtrail"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: bintrail-pg-arm64
    goos: linux
    goarch: arm64
    ids:
      - bintrail-pg
    dockerfile: build/Dockerfile.bintrail-pg.goreleaser
    use: buildx
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES
    image_templates:
      - "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=bintrail-pg"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/dbtrail/dbtrail"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/dbtrail/bintrail:{{ .Version }}"
    image_templates:
      - "ghcr.io/dbtrail/bintrail:{{ .Version }}-amd64"
      - "ghcr.io/dbtrail/bintrail:{{ .Version }}-arm64"
  # skip_push: auto → never move :latest onto a prerelease (e.g. -rc1) tag.
  # The version-specific images/manifest above still push on a prerelease,
  # so an RC tag fully exercises the build+push pipeline without polluting
  # the tag anonymous users pull.
  - name_template: "ghcr.io/dbtrail/bintrail:latest"
    skip_push: "auto"
    image_templates:
      - "ghcr.io/dbtrail/bintrail:{{ .Version }}-amd64"
      - "ghcr.io/dbtrail/bintrail:{{ .Version }}-arm64"

  - name_template: "ghcr.io/dbtrail/bintrail-console:{{ .Version }}"
    image_templates:
      - "ghcr.io/dbtrail/bintrail-console:{{ .Version }}-amd64"
      - "ghcr.io/dbtrail/bintrail-console:{{ .Version }}-arm64"
  # skip_push: auto — same prerelease gating as the core image's :latest.
  - name_template: "ghcr.io/dbtrail/bintrail-console:latest"
    skip_push: "auto"
    image_templates:
      - "ghcr.io/dbtrail/bintrail-console:{{ .Version }}-amd64"
      - "ghcr.io/dbtrail/bintrail-console:{{ .Version }}-arm64"

  - name_template: "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}"
    image_templates:
      - "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}-amd64"
      - "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}-arm64"
  # skip_push: auto — same prerelease gating as the core image's :latest.
  - name_template: "ghcr.io/dbtrail/bintrail-pg:latest"
    skip_push: "auto"
    image_templates:
      - "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}-amd64"
      - "ghcr.io/dbtrail/bintrail-pg:{{ .Version }}-arm64"

# ── Homebrew tap (DEFERRED — do not uncomment until prerequisites exist) ──
# Requires BOTH:
#   1. A tap repository: github.com/dbtrail/homebrew-tap (must be created).
#   2. A HOMEBREW_TAP_GITHUB_TOKEN secret on this repo — a PAT with write
#      access to the tap repo. The default GITHUB_TOKEN CANNOT push to a
#      different repository, so the build-in token is not enough.
# Once both exist, uncomment this block and add the token to the workflow env.
#
# brews:
#   - name: bintrail
#     repository:
#       owner: dbtrail
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
#     homepage: https://github.com/dbtrail/dbtrail
#     description: MySQL binlog time-travel — index row events and generate reversal SQL.
#     license: Apache-2.0
#     install: |
#       bin.install "bintrail"
#       bin.install "bintrail-mcp"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# ── Supply-chain attestations (separable) ──────────────────
# SBOM generation (syft) and cosign keyless signing. These are the most
# likely blocks to need iteration on the first release tag (OIDC / installer
# ordering). If they fight the pipeline, they can be removed wholesale
# without affecting the binary/archive/deb/rpm/Docker outputs above.
sboms:
  # Release archives (tar.gz).
  - id: archives
    artifacts: archive
  # Linux packages — the deb/rpm produced by nfpms (#976). Same syft/SPDX
  # treatment as the archives, as its own config (multiple sbom configs must
  # carry unique ids). The default document name
  # ({{ .ArtifactName }}.sbom.json) stays collision-free across the two
  # configs because the artifact name includes the extension
  # (…_linux_amd64.deb.sbom.json vs …_linux_amd64.tar.gz.sbom.json).
  - id: packages
    artifacts: package

# Keyless cosign signature over checksums.txt (which itself covers every
# artifact). The signature is a Sigstore BUNDLE — checksums.txt.sigstore.json:
# certificate, signature and transparency-log entry in one file, the default
# sign-blob output since cosign v3 (#1350; the older .sig/.pem pair is gone;
# the installer ACTION major is v4 — do not confuse the two). The ci.yml
# `signing` job replays this exact block against a throwaway file on every
# push and same-repo PR, so a cosign or config change that would break the
# release fails while a failed run is cheap — signing otherwise only executes
# on tag push. Contract with that replay: only the ${artifact}/${signature}/
# ${certificate} placeholders, no {{ }} templates — it fails closed on
# anything else. Verification recipe: docs/install.md "Verify a download".
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - id: image-signature
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

  # SBOM attestations for the GHCR images (#976). The sboms block above
  # cannot cover these — GoReleaser's documented limitation: "Container
  # images generated by GoReleaser are not available to be cataloged by the
  # SBOM tool" — so this runs in the publish phase, after each manifest list
  # is pushed: the script generates one syft SPDX SBOM per architecture in
  # the manifest list and attaches each as a cosign attestation on the
  # manifest-list digest, using the same keyless OIDC flow as the signature
  # above. Verify with:
  #   cosign verify-attestation --type spdxjson ghcr.io/dbtrail/bintrail:TAG \
  #     --certificate-identity-regexp "https://github.com/dbtrail/dbtrail/.*" \
  #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
  # Like everything in this section, it is separable: dropping this entry
  # affects no artifact above.
  - id: image-sbom-attestation
    cmd: bash
    artifacts: manifests
    args:
      - scripts/attest-image-sbom.sh
      - "${artifact}"
      - "${digest}"
    output: true
