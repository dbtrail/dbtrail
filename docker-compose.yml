# Bintrail Docker Compose — the zero-friction quickstart.
#
#   1. docker compose up -d
#   2. Open http://127.0.0.1:8090 and create your console username + password
#   3. In the console: "+ Add server" — paste the MySQL to watch; bintrail
#      runs the preflight, provisions an index for it, and starts streaming.
#
# No .env needed. On first run the console asks you to create a username and
# password (it persists in the bintrail-state volume); every later visit is a
# normal sign-in. Forgot it? Reset from the host shell:
#   docker compose exec -it bintrail bintrail-console user set-password
# Optionally set SOURCE_DSN (start streaming one source immediately) in a .env.
# CONSOLE_TOKEN is an opt-in API-automation credential — set it only if a
# script needs the console API; humans sign in with the password.
#
# What you get: a bundled MySQL 8.4 index (persisted in a volume), the
# `bintrail-console watch` daemon against your source (preflight → index
# tables → schema snapshot → live binlog stream → built-in rotation), and the
# web console on http://127.0.0.1:8090.
#
# === THE INDEX VOLUME IS YOUR SYSTEM OF RECORD ===
# The bundled index holds the forensic record (binlog_events with full
# before/after images). Its data lives in TWO volumes that must be backed up
# and RESTORED together: `bintrail-index-data` (the MySQL datadir) and
# `bintrail-index-secret` (the password, baked into the datadir at first boot).
# Restoring a datadir paired with a mismatched secret breaks auth; changing the
# password later means resetting both. Losing only the data volume is safe — the
# surviving secret re-initializes a fresh datadir with the same password and
# bintrail re-indexes from the source's binlogs.
#
# bintrail SHIPS this MySQL but does NOT operate it: disk, backups, and upgrades
# are yours — for a managed, operated index, that is what dbtrail is. Support
# boundary: SUPPORT.md. Bring your own instead: set INDEX_DSN in .env (see
# docs/docker.md).
#
# Opt-in profiles (neither runs by default): `baseline` (snapshot for the
# console's Time-travel reconstruct) and `flashback` (a `mysql` time-travel
# terminal on :3308 — set SHIM_USER/SHIM_PASSWORD; see docs/docker.md).
#
# For the full interactive demo (traffic generator, Grafana, Prometheus),
# see demo/compose.yml instead.
#
# === UPGRADING: PULL THE IMAGES AND RE-DOWNLOAD THIS FILE ===
# `docker compose pull && docker compose up -d` upgrades the images and NOT
# this file, which is yours. Wiring that ships here (volumes, mounts, ports,
# profiles) is not something a newer image can add for you, so take the current
# file on every upgrade. Download it BESIDE yours, never over it, or the edits
# you are about to carry across are gone before you look at them:
#   curl -fsSL -o docker-compose.yml.new https://raw.githubusercontent.com/dbtrail/dbtrail/main/docker-compose.yml
#   diff docker-compose.yml docker-compose.yml.new
#   mv docker-compose.yml.new docker-compose.yml
# See docs/docker.md, "Upgrading the stack", for what a stale file costs.

# The version of this file, so the daemon can tell you what it is missing
# instead of leaving you to diff two files (#1529). It is passed to the
# console service below through the YAML anchor, so there is one number to
# bump: raise it whenever this file gains wiring a running stack would need.
x-bintrail-compose-version: &compose_version 1

volumes:
  bintrail-index-data:    # MySQL 8.4 datadir — the forensic record (NEW volume:
                          # never reuse the old 8.0 `index-mysql-data`, an 8.4
                          # server auto-upgrades an 8.0 datadir irreversibly).
  bintrail-index-secret:  # the generated index password (shares fate with the
                          # datadir — back up / reset the two together).
  bintrail-state:         # bintrail runtime state (saved console servers,
                          # archive staging, baseline snapshots, …).
  bintrail-dump:          # transient mydumper output for the `baseline`
                          # profile (its snapshot/ dir is recreated from
                          # scratch every run — never store anything here).
  bintrail-iceberg:       # Iceberg tables written by the `iceberg-export`
                          # profile. An OUTPUT, never a system of record: it is
                          # rebuilt from the index and the baselines, so losing
                          # it costs a re-export and nothing else.
  drill-scratch-data:     # THROWAWAY datadir for the `drill` profile's scratch
                          # MySQL. Never holds anything worth keeping — wipe it
                          # between drills with:
                          #   docker compose --profile drill rm -sf drill-mysql
                          #   docker volume rm <project>_drill-scratch-data
                          # NEVER `docker compose down -v` — it also removes
                          # the INDEX volumes above (your system of record).

services:

  # ── Index password (one-shot) ────────────────────────────
  # Generates a random index MySQL password on first boot (or takes one
  # from INDEX_MYSQL_ROOT_PASSWORD in .env if you set it BEFORE the first
  # `up` — changing it later means resetting the index volumes). Both the
  # index MySQL and bintrail read it from the secret volume, so there is no
  # static default password on a volume holding the forensic record.
  index-init:
    # Reuses the console image (already pulled for the main service below) —
    # this step only needs a shell + od to seed the password file.
    image: ghcr.io/dbtrail/bintrail-console:${BINTRAIL_TAG:-latest}
    # Building from a source checkout instead? Uncomment here AND on the
    # bintrail service below (keep the image: lines — `docker compose build`
    # tags the local build with that name, so nothing is pulled):
    # build:
    #   context: .
    #   dockerfile: build/Dockerfile.bintrail-console
    # Runs as root: a freshly-created named volume is root-owned, and the
    # bintrail image otherwise runs as a non-root user that couldn't write it.
    # The secret is then chowned to uid 999 mode 0600 FOR the bintrail process
    # (uid 999), the only non-root reader. The index-mysql side reads it as
    # root — the entrypoint reads MYSQL_ROOT_PASSWORD_FILE before dropping to
    # the mysql user, and the healthcheck runs as root — both bypass the mode.
    # Not world-readable.
    user: "0:0"
    environment:
      INDEX_MYSQL_ROOT_PASSWORD: ${INDEX_MYSQL_ROOT_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        f=/secret/index_password
        if [ -s "$$f" ]; then exit 0; fi   # already seeded; password is fixed at datadir init
        if [ -n "$$INDEX_MYSQL_ROOT_PASSWORD" ]; then
          printf '%s' "$$INDEX_MYSQL_ROOT_PASSWORD" > "$$f"
          echo "Index MySQL password taken from INDEX_MYSQL_ROOT_PASSWORD."
        else
          od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > "$$f"
          echo "Generated a random index MySQL password (stored in the bintrail-index-secret volume)."
        fi
        # dash has no pipefail and `set -e` only checks the last pipe stage, so a
        # failed od/urandom would leave an EMPTY file. Refuse a blank password
        # rather than let MySQL refuse to initialize with a confusing error.
        if [ ! -s "$$f" ]; then echo "FATAL: failed to write the index password" >&2; rm -f "$$f"; exit 1; fi
        chown 999:999 "$$f"
        chmod 0600 "$$f"
    volumes:
      - bintrail-index-secret:/secret

  # ── Index MySQL 8.4 (the forensic record) ────────────────
  # Stores binlog_events, schema_snapshots, and stream_state. Pinned to an
  # exact 8.4 LTS minor — bump it deliberately (swap the container; the
  # datadir volume persists, PMM-style). Bring your own instead: set
  # INDEX_DSN in .env and remove this service, index-init, and the
  # bintrail-index-secret mount on `bintrail` (see docs/docker.md).
  index-mysql:
    image: mysql:8.4.9
    # --innodb-flush-log-at-trx-commit=2 is the one safe index-side tuning
    # (bintrail replays from the stream_state checkpoint, so a ≤1s recovery
    # window is acceptable). buffer-pool size is left at the default — it
    # depends on host RAM and is the operator's to tune (docs/deployment.md §3).
    #
    # --sort-buffer-size=4M raises the stock default (256K on MySQL 8.x).
    # binlog_events stores
    # full before/after row images as JSON, and a single fat row (e.g. a
    # WordPress wp_options autoload blob, observed at ~750K) can exceed 256K. A
    # filesort that carries such a row as an addon field then dies with
    # ER_OUT_OF_SORTMEMORY (1038). The query engine avoids this on the hot path
    # by sorting narrow keys only (internal/query late materialization); 4M is
    # defense-in-depth for any other sort, bounded and cheap at this index's low
    # connection concurrency.
    #
    # --max-allowed-packet=1G raises the 64M stock default. Each INSERT into
    # binlog_events carries full before/after row images as JSON; a single large
    # BLOB/JSON value is base64-inflated ~1.33× and can exceed 64M, which the
    # server rejects (the reproduced Error 1105 in #652). 1G is the MySQL
    # maximum. bintrail's client tracks this via config.Connect
    # (maxAllowedPacket=0 → fetched from the server). This is a ceiling raise,
    # not a fix: events above 1G are still rejected and must — but do not yet
    # (#652) — fail loud rather than drop silently.
    #
    # Write-throughput tuning for the index workload (append-mostly batched
    # INSERTs of large JSON row images). mysql:8.4 already ships most of the
    # high-write defaults (io_capacity=10000, log_buffer=64M, flush_neighbors=0,
    # change buffer + adaptive hash off), so only three overrides remain:
    #
    # --skip-log-bin: the index is a write-only sink — nothing replicates FROM
    # it, and bintrail reconstructs by re-streaming from the SOURCE, never from
    # the index's own binlog. 8.4 defaults log_bin=ON + sync_binlog=1, which
    # writes a second full ROW copy of every JSON image AND fsyncs per commit —
    # re-introducing the very fsync that --innodb-flush-log-at-trx-commit=2 was
    # set to remove. Disabling it is the largest single write win and is what
    # makes trx_commit=2 actually pay off. (Safe: gtid_mode=OFF by default; a
    # GTID-enabled server would reject --skip-log-bin.)
    #
    # --innodb-redo-log-capacity=2G: 8.4 defaults to 100M (this knob replaced
    # innodb_log_file_size in 8.0.30+). 100M is small for bursts of large JSON
    # images and triggers sharp-checkpoint / async-flush stalls — the dominant
    # throughput risk once trx_commit=2 removes the per-commit fsync. Costs disk
    # under #innodb_redo (operator's to budget, see capacity.md), zero
    # durability cost at trx_commit=2.
    #
    # --innodb-flush-method=O_DIRECT: 8.4 still defaults to fsync. O_DIRECT skips
    # the OS page-cache double-buffering of dirty InnoDB pages, which matters for
    # this LOB-heavy write path. Works on the local-driver named volume below; an
    # operator who repoints the volume at an exotic filesystem may need to drop
    # this one flag.
    #
    # Buffer pool stays at the 128M default — it is host-RAM dependent and the
    # operator's to size (docs/deployment.md §3); we never hardcode a RAM number.
    command:
      - "--innodb-flush-log-at-trx-commit=2"
      - "--sort-buffer-size=4M"
      - "--max-allowed-packet=1G"
      - "--skip-log-bin"
      - "--innodb-redo-log-capacity=2147483648"
      - "--innodb-flush-method=O_DIRECT"
    environment:
      # 8.4 defaults to caching_sha2_password (native_password disabled);
      # bintrail's driver negotiates it over the plaintext Docker network.
      MYSQL_ROOT_PASSWORD_FILE: /run/secret/index_password
      MYSQL_DATABASE: bintrail_index
    volumes:
      - bintrail-index-data:/var/lib/mysql
      - bintrail-index-secret:/run/secret:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$(cat /run/secret/index_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      index-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Bintrail: stream + web console ───────────────────────
  # `bintrail-console watch` = doctor preflight + init + auto-snapshot +
  # binlog stream + built-in rotation + the read-only web console (the
  # daemon formerly known as `bintrail up --console`).
  bintrail:
    image: ghcr.io/dbtrail/bintrail-console:${BINTRAIL_TAG:-latest}
    # Building from a source checkout instead? Uncomment here AND on
    # index-init above (keep the image: lines — `docker compose build` tags
    # the local build with that name, so nothing is pulled):
    # build:
    #   context: .
    #   dockerfile: build/Dockerfile.bintrail-console
    ports:
      # Console on the host loopback only — first-run password setup is allowed
      # because reaching loopback already implies local access. To reach it from
      # another machine, first create the password from the host shell
      # (docker compose exec -it bintrail bintrail-console user set-password —
      # off-loopback setup is refused), THEN change to "8090:8090", ideally
      # behind TLS or a TLS-terminating proxy.
      - "127.0.0.1:8090:8090"
      # Prometheus /metrics on the host loopback (the daemon serves it because
      # of BINTRAIL_METRICS_ADDR below). A host-run Prometheus scrapes
      # 127.0.0.1:9090; a Prometheus CONTAINER on this compose network scrapes
      # bintrail:9090 and does not need this mapping. /metrics has no auth —
      # widen to "9090:9090" only behind a firewall (docs/deployment.md §7).
      # If you disable metrics (METRICS_ADDR= empty in .env) this mapping stays
      # but nothing listens behind it — connections are simply refused.
      - "127.0.0.1:9090:9090"
    environment:
      # Optional: a source MySQL to start watching immediately. Leave unset
      # and add servers from the console UI instead (the zero-config path).
      SOURCE_DSN: ${SOURCE_DSN:-}
      # Bring your own index: set INDEX_DSN in .env to override the bundled
      # MySQL entirely. Empty = use the bundled index (DSN built from the
      # generated password below).
      INDEX_DSN: ${INDEX_DSN:-}
      # Optional comma-separated schema filter (empty = all user schemas).
      SCHEMAS: ${SCHEMAS:-}
      # The console binds all interfaces INSIDE the container; the `ports`
      # mapping above is what controls actual exposure on the host.
      BINTRAIL_CONSOLE_LISTEN: 0.0.0.0:8090
      # Prometheus metrics for the watch daemon: stream lag/error counters for
      # every supervised source plus the bintrail_index_* gauges (all metrics
      # carry a "source" label). deployment.md §7 ships scrape config and
      # alerting rules against this endpoint. On by default so the shipped
      # stack is observable out of the box; set METRICS_ADDR= (empty) in .env
      # to disable. The `ports` mapping above controls actual host exposure.
      BINTRAIL_METRICS_ADDR: ${METRICS_ADDR-:9090}
      BINTRAIL_CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      # Saved console connections persist across container recreations.
      BINTRAIL_CONSOLE_SERVERS: /var/lib/bintrail/console-servers.yaml
      # Local staging for the "Archive to S3" feature (a source's rotated
      # Parquet is written here, uploaded to its configured bucket, then
      # pruned). Lives in the state volume so an interrupted upload survives a
      # restart.
      BINTRAIL_CONSOLE_ARCHIVE_STAGING: /var/lib/bintrail/archives
      # AWS credentials for "Archive to S3" (the bucket is set per-source from
      # the console UI). Passed through from .env; leave empty to rely on an
      # IAM role (EC2/EKS) or a mounted ~/.aws. Needed for BOTH the upload and
      # the console querying the archived Parquet back from S3.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      # S3-compatible store (MinIO, Wasabi): one endpoint for every S3 path,
      # archive uploads and DuckDB reads alike. Empty = AWS S3.
      BINTRAIL_S3_ENDPOINT: ${BINTRAIL_S3_ENDPOINT:-}
      BINTRAIL_S3_PATH_STYLE: ${BINTRAIL_S3_PATH_STYLE:-}
      # Baselines for the boot entry (the cli-seeded server backed by the
      # index DSN — the one a SOURCE_DSN stream writes into): set
      # BASELINE_DIR=/var/lib/bintrail/baselines in .env after producing
      # snapshots with the `baseline` profile below — it enables the console's
      # Time-travel surface on that entry. Servers added from the UI configure
      # it per server instead (Edit → Advanced → "Baseline dir", same path).
      # Left empty by default: the gate is config-based, so setting it with no
      # snapshots would show a Time-travel tab with nothing behind it.
      BINTRAIL_CONSOLE_BASELINE_DIR: ${BASELINE_DIR:-}
      # "Create baseline" button (#613): lets the console create baseline
      # snapshots in-process (dump→convert→upload) for a monitored server. The
      # console image bundles mydumper and runs it as a LOCAL subprocess — NO
      # docker socket is mounted (the console never gets host-root). A server
      # still needs a source DSN AND a baseline dir/S3 configured before the
      # button does anything — unlike BASELINE_DIR above, on-by-default here is
      # safe because the button *creates* the missing baseline rather than
      # exposing an empty surface. On by default; set BASELINE_TRIGGER=0 in
      # .env to disable. Staging for S3-destined baselines lives on the state
      # volume.
      BINTRAIL_CONSOLE_BASELINE_TRIGGER: ${BASELINE_TRIGGER:-1}
      # How a console-triggered baseline syncs mydumper's threads onto one
      # instant: ftwrl (default, point-consistent), lock-all (point-consistent,
      # needs only LOCK TABLES — use it on managed MySQL such as RDS, where
      # BACKUP_ADMIN cannot be granted), safe-no-lock (no extra
      # privilege, ABORTS rather than emit a torn snapshot) or no-lock
      # (accepts a torn snapshot). A baseline is the seed state reconstruct
      # merges deltas onto, so the weaker modes must be asked for (#1377/#1378).
      BINTRAIL_CONSOLE_BASELINE_LOCK_MODE: ${BASELINE_LOCK_MODE:-ftwrl}
      BINTRAIL_CONSOLE_BASELINE_STAGING: /var/lib/bintrail/baseline-staging
      # Prune local backup snapshots older than this once S3 holds a copy
      # (Nh/Nd). Empty = keep everything local. Worth setting with a short
      # schedule: every run publishes a full-table snapshot. It reclaims only
      # servers that have an S3 destination; the boot entry here has none.
      BINTRAIL_CONSOLE_BASELINE_RETAIN: ${BASELINE_RETAIN:-}
      # "Run verification" button (#677): lets the console run `bintrail verify`
      # in-process for a monitored server (trigger, poll per-table results,
      # explain a mismatch) — the same read-only baseline/index reads the
      # console already does for Reconstruct, no subprocess and no live-source
      # read in its default (baseline-anchored) mode. Lower risk than the
      # Create-baseline button above, so it defaults ON without an opt-in
      # period; set VERIFY_TRIGGER=0 in .env to disable. A server still needs
      # a baseline dir/S3 configured (baseline-anchored) or a source DSN
      # (live-source) before the button does anything.
      BINTRAIL_CONSOLE_VERIFY_TRIGGER: ${VERIFY_TRIGGER:-1}
      # Password login (persists next to the registry). On first run the
      # console serves a "create your password" screen; later visits sign in.
      # There is deliberately NO password env var: docker inspect must never
      # be able to print a credential.
      BINTRAIL_CONSOLE_AUTH: /var/lib/bintrail/console-auth.yaml
      # The managed MCP token (Settings → Connect AI), stored as a SHA-256
      # hash. On the volume for the same reason as the two above: without this
      # it would land in the container's writable layer, and every recreation
      # would silently revoke it. The console cannot tell a wiped token from a
      # fresh install, so it would come up quiet while the configured AI
      # client got a 401 on every call. The value is the FILE PATH, not the
      # token: like the password above, the credential itself is never an env
      # var, and BINTRAIL_CONSOLE_TOKEN (the static API token, further up) is
      # the one that takes a value.
      BINTRAIL_CONSOLE_MCP_TOKEN_FILE: /var/lib/bintrail/console-mcp-token.yaml
      # The console binds 0.0.0.0 INSIDE the container, but the `ports` mapping
      # above publishes it on the host's loopback only — so first-run setup is
      # access-controlled in the default stack. The container can't see the
      # host mapping, so we assert it here. If you change `ports` to expose the
      # console (e.g. "8090:8090"), set the password from the host shell FIRST
      # (docker compose exec … user set-password) before exposing it.
      BINTRAIL_CONSOLE_ALLOW_SETUP: "1"
      # The version of this file (the x- key at the top). The daemon reads it
      # to name what a stale file is missing; without it the daemon says
      # nothing about the file's age, so an older stack raises no false alarm.
      BINTRAIL_COMPOSE_VERSION: *compose_version
    volumes:
      - bintrail-state:/var/lib/bintrail
      - bintrail-index-secret:/run/secret:ro
      # Read-only mount of the SAME named volume index-mysql writes its
      # datadir to (#948). `doctor`'s disk-capacity check needs an OS-level
      # `statfs` to measure free space — there is no SQL equivalent
      # (information_schema/performance_schema expose no `df`) — but the
      # bundled index lives in a SEPARATE container this service only ever
      # reaches over TCP. A read-only bind of the same volume reports the
      # real underlying filesystem's free space regardless of which
      # container mounted it or in what mode: safe and standard. Only ever
      # TRUSTED when BINTRAIL_INDEX_DATADIR_RO is set below — see that
      # comment for the invariant that keeps this mount and the DSN in
      # effect from drifting apart.
      - bintrail-index-data:/var/lib/bintrail-index-ro:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Use the bundled index unless the operator brought their own. The
        # generated password lives in the secret volume; build the DSN from it.
        # NOTE: plain assignment on purpose — under `set -e` it propagates a
        # failed `cat` (unreadable secret) and aborts loud; `export`/`local`
        # would mask the substitution's exit status and build an empty password.
        if [ -z "$$INDEX_DSN" ]; then
          INDEX_DSN="root:$$(cat /run/secret/index_password)@tcp(index-mysql:3306)/bintrail_index"
          # SAFETY INVARIANT (#948): this is set ONLY inside this branch —
          # the ONE branch that also builds the bundled tcp(index-mysql:3306)
          # DSN above — so the read-only mount above and the DSN actually in
          # effect can never point at different volumes. A literal string
          # assignment, so `export` here does not hide a failure the way it
          # would for the `cat`-derived INDEX_DSN above. A BYO INDEX_DSN
          # (operator-supplied, unrelated MySQL) skips this branch entirely,
          # so this var stays unset for BYO — capacity.go then falls back to
          # its loopback/hostname check and, failing that, reports free space
          # as not measurable (a SKIP with guidance that names what is
          # missing, never a green PASS). Never let this var leak into the BYO
          # path: that would report a random volume's free space as if it
          # were the real index's.
          export BINTRAIL_INDEX_DATADIR_RO=/var/lib/bintrail-index-ro
        fi
        # No token is generated: the console binds to loopback, so first run is
        # password SETUP — open the printed URL and create your console
        # username and password (it persists in the bintrail-state volume next
        # to the server registry). CONSOLE_TOKEN in .env is an opt-in API
        # automation credential, passed through via the environment above; it
        # is not generated for you.
        if [ -n "$$SOURCE_DSN" ] && [ -n "$$SCHEMAS" ]; then
          exec bintrail-console watch --source-dsn "$$SOURCE_DSN" --index-dsn "$$INDEX_DSN" --schemas "$$SCHEMAS"
        elif [ -n "$$SOURCE_DSN" ]; then
          exec bintrail-console watch --source-dsn "$$SOURCE_DSN" --index-dsn "$$INDEX_DSN"
        fi
        exec bintrail-console watch --index-dsn "$$INDEX_DSN"
    # Liveness probe against the console's unauthenticated GET /api/healthz
    # (wget ships in the image). It detects a daemon whose HTTP loop is dead
    # (deadlock, wedged event loop) and surfaces health in `docker ps` and to
    # anything that acts on Docker health status. HONEST LIMITS: (1) plain
    # Docker/Compose only auto-restarts on process EXIT — an `unhealthy`
    # container is marked, not restarted (Swarm, Kubernetes, Podman
    # --health-on-failure, or an autoheal sidecar are the pieces that act on
    # it; running one is the operator's call); (2) a capture STALL with a live
    # HTTP loop (e.g. source unreachable mid-gap-fill) passes this probe — for
    # that, alert on the /metrics endpoint above (stream lag/error rules in
    # docs/deployment.md §7) or run `bintrail status --fail-on-gap` from cron.
    # start_period covers the doctor preflight + init + schema snapshot a
    # SOURCE_DSN boot runs before the console binds.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8090/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      index-mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── Time-travel SQL terminal (opt-in `flashback` profile) ─
  # Runs `bintrail shim` — an in-process MySQL-protocol server that answers the
  # virtual _flashback / _snapshot / _diff schemas against the bundled index.
  # Point a plain `mysql` client at :3308 and read historical row state — NO
  # ProxySQL required.
  #
  # SCOPE: this shim serves the boot `SOURCE_DSN` source — the one the `bintrail`
  # service streams into `bintrail_index`. So it needs SOURCE_DSN set in .env AND
  # the main stack running: the `bintrail` service creates the index tables and
  # streams; the shim only reads, it never provisions. Bring it up WITH the full
  # stack — `up -d`, NOT `up -d shim` (which would skip `bintrail` and leave the
  # index empty):
  #
  #   # in .env: SOURCE_DSN=user:pass@tcp(your-db:3306)/yourdb
  #   SHIM_USER=analyst SHIM_PASSWORD='pick-a-strong-one' \
  #     docker compose --profile flashback up -d
  #   mysql -h 127.0.0.1 -P 3308 -u analyst -p
  #   mysql> USE yourdb;
  #   mysql> SELECT * FROM _flashback.orders AS OF '2026-05-02 10:00:00' WHERE id = 1;
  #
  # Sources added from the console UI stream into their OWN per-source index DB
  # (bintrail_idx_<id>), NOT bintrail_index — to time-travel one of those, point
  # INDEX_DSN at that database. Won't start / returns nothing? Almost always a
  # missing SHIM_USER/SHIM_PASSWORD or an unset SOURCE_DSN — `docker compose logs
  # shim` shows the FATAL line (the restart policy can bury it under `ps`).
  #
  # This is a DEDICATED terminal: a normal `SELECT * FROM orders` here returns
  # ER_NOT_SUPPORTED_YET (1235). Transparently mixing normal and AS OF queries on
  # one connection is what ProxySQL adds and is out of scope — docs/time-travel-sql.md.
  #
  # Opt-in because it needs YOU to choose the login it authenticates against —
  # there is deliberately no default credential on a MySQL port. Uses the CORE
  # image (the console image omits the `shim` command). Full-table _snapshot.*
  # needs a baseline: run the `baseline` profile, then set BASELINE_DIR.
  shim:
    profiles: ["flashback"]
    image: ghcr.io/dbtrail/bintrail:${BINTRAIL_TAG:-latest}
    ports:
      # Loopback only. The shim binds 0.0.0.0 INSIDE the container so this host
      # mapping can reach it (it logs a non-loopback Warn for that bind, which
      # is expected — the mapping below is the real exposure control). To reach
      # it from another host, change to "3308:3308", ideally behind TLS/stunnel.
      - "127.0.0.1:3308:3308"
    environment:
      # REQUIRED: the login your `mysql` client authenticates with. No default —
      # shipping a known credential on a MySQL port would be a footgun.
      SHIM_USER: ${SHIM_USER:-}
      SHIM_PASSWORD: ${SHIM_PASSWORD:-}
      # The source streamed into bintrail_index — also derives the default schema
      # so `_flashback.orders` resolves without a prior `USE` (parse-only — the
      # shim never connects to it). If unset, run `USE <db>` first in the client.
      SOURCE_DSN: ${SOURCE_DSN:-}
      # Bring your own index (default: the bundled MySQL, DSN built from the
      # generated password in the secret volume).
      INDEX_DSN: ${INDEX_DSN:-}
      # Enables full-table _snapshot.* (baseline + deltas → complete rows). Set
      # to /var/lib/bintrail/baselines after a `baseline` profile run — same
      # path as the console's BASELINE_DIR. Empty = binlog-only _flashback.
      BASELINE_DIR: ${BASELINE_DIR:-}
      # Optional client auth plugin. The default (mysql_native_password) works
      # for the `mysql` CLI; set caching_sha2_password for drivers that require
      # it (those clients then need TLS or a primed SHA2 cache to the shim).
      SHIM_AUTH_METHOD: ${SHIM_AUTH_METHOD:-}
    volumes:
      - bintrail-state:/var/lib/bintrail:ro   # read-only: baselines for _snapshot
      - bintrail-index-secret:/run/secret:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$SHIM_USER" ] || [ -z "$$SHIM_PASSWORD" ]; then
          echo "FATAL: set SHIM_USER and SHIM_PASSWORD to the login your mysql client will use, e.g." >&2
          echo "  SHIM_USER=analyst SHIM_PASSWORD='...' docker compose --profile flashback up -d" >&2
          exit 1
        fi
        # A newline in a credential would fold in the single-quoted YAML into a
        # silently-wrong value (auth then fails with no hint) — reject it loud,
        # the same rejection `bintrail init-shim` makes.
        if [ "$$(printf '%s' "$$SHIM_USER$$SHIM_PASSWORD" | wc -l)" -ne 0 ]; then
          echo "FATAL: SHIM_USER / SHIM_PASSWORD must not contain a newline" >&2
          exit 1
        fi
        # Build the bundled-index DSN from the generated password unless the
        # operator brought their own. Plain assignment under `set -e` so an
        # unreadable secret aborts loud (see the bintrail service for why).
        if [ -z "$$INDEX_DSN" ]; then
          INDEX_DSN="root:$$(cat /run/secret/index_password)@tcp(index-mysql:3306)/bintrail_index"
        fi
        # One-tenant shim.yaml in /tmp (regenerated from env every boot — not
        # persisted, so the state volume stays read-only). server_id is a label
        # (the shim does not filter events by it); source_dsn is parse-only.
        # Single-quoted YAML (matching `bintrail init-shim`): the only escape is
        # ' -> '', so a password with \ or " survives literally.
        esc() { printf '%s' "$$1" | sed "s/'/''/g"; }
        umask 077
        printf "listen: '0.0.0.0:3308'\ntenants:\n  - server_id: 'compose-shim'\n    source_dsn: '%s'\n    mysql_user: '%s'\n    mysql_password: '%s'\n" \
          "$$(esc "$$SOURCE_DSN")" "$$(esc "$$SHIM_USER")" "$$(esc "$$SHIM_PASSWORD")" > /tmp/shim.yaml
        # The flag --listen (not shim.yaml's listen:) drives the actual bind, so
        # 0.0.0.0 must be passed here for the host port mapping to reach it.
        set -- shim --listen 0.0.0.0:3308 --shim-config /tmp/shim.yaml --index-dsn "$$INDEX_DSN"
        [ -n "$$BASELINE_DIR" ] && set -- "$$@" --baseline-dir "$$BASELINE_DIR"
        [ -n "$$SHIM_AUTH_METHOD" ] && set -- "$$@" --auth-method "$$SHIM_AUTH_METHOD"
        exec bintrail "$$@"
    depends_on:
      index-mysql:
        condition: service_healthy
      # The shim only reads the index; the `bintrail` service is what creates
      # the tables and streams the boot SOURCE_DSN source into bintrail_index.
      # Depend on its HEALTH (the daemon answering, not just the process
      # started) so `up -d shim` can't start against an unprovisioned index.
      bintrail:
        condition: service_healthy
    restart: unless-stopped

  # ── Baselines (one-shot, opt-in `baseline` profile) ──────
  # Produces the full-table Parquet snapshots Time-travel reconstructs from
  # (baseline + binlog deltas → complete rows, not just rows with binlog
  # activity). Two one-shot steps: the official mydumper image dumps the
  # source over the network into a transient volume, then the core bintrail
  # CLI image converts the dump to Parquet in the state volume. Run on demand
  # (or from cron):
  #
  #   BASELINE_SOURCE_DSN="user:pass@tcp(db.example.com:3306)/" \
  #     docker compose --profile baseline run --rm baseline
  #
  # BASELINE_SOURCE_DSN defaults to SOURCE_DSN, so the single-source stack
  # needs no extra configuration. Snapshots land in
  # /var/lib/bintrail/baselines (the bintrail-state volume); point the
  # console at them per server (Edit → Advanced → "Baseline dir") or via
  # BASELINE_DIR for the boot entry. See docs/docker.md.
  baseline-dump:
    profiles: ["baseline"]
    # Pinned upstream image (the light-locking flags below need mydumper
    # >= 0.18; distro-apt builds are older and would reject them).
    image: mydumper/mydumper:v1.0.3-1
    environment:
      BASELINE_SOURCE_DSN: ${BASELINE_SOURCE_DSN:-${SOURCE_DSN:-}}
      # Comma-separated schemas to snapshot (defaults to SCHEMAS; empty = all
      # USER schemas — the system schemas mysql/sys/performance_schema/
      # information_schema are always excluded, see the dump command below).
      BASELINE_SCHEMAS: ${BASELINE_SCHEMAS:-${SCHEMAS:-}}
      # Same knob and same vocabulary as the console's
      # BINTRAIL_CONSOLE_BASELINE_LOCK_MODE: ftwrl | lock-all | safe-no-lock | no-lock.
      # It MUST be listed here or it never enters the container and the
      # operator's choice is silently ignored (#1378).
      BASELINE_LOCK_MODE: ${BASELINE_LOCK_MODE:-ftwrl}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        dsn="$$BASELINE_SOURCE_DSN"
        if [ -z "$$dsn" ]; then
          echo "FATAL: set BASELINE_SOURCE_DSN (or SOURCE_DSN) to the source MySQL to snapshot, e.g." >&2
          echo '  BASELINE_SOURCE_DSN="user:pass@tcp(db.example.com:3306)/" docker compose --profile baseline run --rm baseline' >&2
          exit 1
        fi
        case "$$dsn" in
          *"@tcp("*")"*) ;;
          *) echo "FATAL: BASELINE_SOURCE_DSN must be a Go MySQL DSN like user:pass@tcp(host:3306)/" >&2; exit 1 ;;
        esac
        # Decompose the DSN in shell: split on the LAST "@tcp(" so passwords
        # containing "@" survive; the username cannot contain ":" in a Go DSN,
        # so the first ":" splits user from password.
        hostport="$${dsn##*@tcp(}"; hostport="$${hostport%%)*}"
        case "$$hostport" in
          *:*) ;;
          *) echo "FATAL: the DSN must include host:port, e.g. @tcp(db.example.com:3306)" >&2; exit 1 ;;
        esac
        host="$${hostport%%:*}"; port="$${hostport##*:}"
        creds="$${dsn%@tcp(*}"
        user="$${creds%%:*}"
        pass="$${creds#*:}"; [ "$$pass" = "$$creds" ] && pass=""
        if [ -z "$$host" ] || [ -z "$$user" ]; then
          echo "FATAL: could not parse host/user from BASELINE_SOURCE_DSN" >&2; exit 1
        fi
        # Fresh dump every run — mydumper refuses a non-empty output dir, and
        # stale dumps must never be converted as if they were current.
        rm -rf /dump/snapshot
        mkdir -p /dump/snapshot
        # Mirror `bintrail dump`'s mydumper invocation (cmd/bintrail/dump.go):
        # point-consistent by default (flags exist since mydumper 0.18), compressed
        # protocol, complete INSERTs, and
        # --outputdir last. The metadata file it writes carries the binlog
        # coordinates `bintrail baseline` embeds in the Parquet.
        # Translate the operator vocabulary to mydumper's. A typo must FAIL
        # here rather than fall through to a weaker mode: the whole point of
        # the default is that a torn snapshot has to be asked for.
        case "$${BASELINE_LOCK_MODE:-ftwrl}" in
          ftwrl)        sync_mode=FTWRL ;;
          lock-all)     sync_mode=LOCK_ALL ;;
          safe-no-lock) sync_mode=SAFE_NO_LOCK ;;
          no-lock)      sync_mode=NO_LOCK ;;
          *) echo "FATAL: BASELINE_LOCK_MODE='$$BASELINE_LOCK_MODE' is not one of: ftwrl, lock-all, safe-no-lock, no-lock" >&2; exit 1 ;;
        esac
        set -- --host "$$host" --port "$$port" --user "$$user" \
          --threads 4 --compress-protocol --complete-insert \
          --sync-thread-lock-mode "$$sync_mode" --trx-tables
        [ -n "$$pass" ] && set -- "$$@" --password "$$pass"
        schemas="$$(printf '%s' "$$BASELINE_SCHEMAS" | tr -d ' ')"
        if [ -n "$$schemas" ]; then
          case "$$schemas" in
            *,*) set -- "$$@" --regex "^($$(printf '%s' "$$schemas" | tr ',' '|'))\\." ;;
            *)   set -- "$$@" --database "$$schemas" ;;
          esac
        else
          # No explicit schemas: dump every USER schema but exclude the system
          # ones. A least-privilege capture user (REPLICATION + SELECT, no
          # SHOW VIEW) cannot read the sys views, so an unfiltered mydumper dies
          # with "SHOW VIEW command denied ... sys.host_summary" — and the system
          # schemas are useless as a baseline anyway. Negative-lookahead PCRE
          # (mydumper uses PCRE) drops any system db, both bare and <db>.<table>;
          # $$ is a literal $ after compose interpolation, \\. a literal \.
          set -- "$$@" --regex "^(?!(mysql|sys|performance_schema|information_schema)($$|\\.))"
        fi
        set -- "$$@" --outputdir /dump/snapshot
        mydumper "$$@"
        # GUARD: mydumper exits 0 for a --regex that matches nothing and for
        # schemas the dump user cannot read — both yield a metadata-only or
        # partial dump that `bintrail baseline` would happily convert into an
        # incomplete baseline (silently wrong Time-travel reconstructions,
        # the worst failure class). "exit 0" is NOT "the baseline is
        # complete": verify table data actually landed, per schema when a
        # filter was given.
        if ! ls /dump/snapshot | grep -q -- '-schema\.sql'; then
          echo "FATAL: the dump produced no tables — check BASELINE_SCHEMAS and the dump user's privileges" >&2
          exit 1
        fi
        if [ -n "$$schemas" ]; then
          for sc in $$(printf '%s' "$$schemas" | tr ',' ' '); do
            if ! ls /dump/snapshot | grep -q "^$$sc\."; then
              echo "FATAL: schema '$$sc' is missing from the dump — check the name and the dump user's SELECT privileges" >&2
              exit 1
            fi
          done
        fi
        # The convert step runs as the bintrail image's non-root uid 999:
        # hand it the dump, and pre-create the baselines dir in the state
        # volume (whose root may be root-owned when this profile runs before
        # the main stack ever initialized it).
        chown -R 999:999 /dump/snapshot
        mkdir -p /state/baselines
        chown 999:999 /state/baselines
        echo "Dump complete: $$(ls /dump/snapshot | grep -c -- '-schema\.sql') table(s)."
    volumes:
      - bintrail-dump:/dump
      - bintrail-state:/state

  baseline:
    profiles: ["baseline"]
    # The CORE CLI image — the console image deliberately ships without the
    # dump/baseline commands.
    image: ghcr.io/dbtrail/bintrail:${BINTRAIL_TAG:-latest}
    command: ["baseline", "--input", "/dump/snapshot", "--output", "/var/lib/bintrail/baselines"]
    volumes:
      - bintrail-dump:/dump
      - bintrail-state:/var/lib/bintrail
    depends_on:
      baseline-dump:
        condition: service_completed_successfully

  # ── Iceberg export (one-shot, opt-in `iceberg-export` profile) ──────────
  # Writes each table's state as an Apache Iceberg table, from the newest
  # baseline snapshot plus every change the index has recorded since. Spark,
  # Trino, Athena, Snowflake and DuckDB read the result directly. Run on
  # demand:
  #
  #   docker compose --profile iceberg-export run --rm iceberg-export
  #
  # or from the host's crontab, hourly (cd to the directory holding this file):
  #
  #   17 * * * * cd /path/to/stack && docker compose --profile iceberg-export run --rm iceberg-export >> /var/log/bintrail-iceberg.log 2>&1
  #
  # The first run loads the newest snapshot; every run after that appends only
  # what changed, and a run that dies before committing leaves the previous
  # copy in place and resumes from it. It needs a baseline, so run the
  # `baseline` profile first (or point BASELINE_S3 at snapshots you already
  # have). Tables land in <WAREHOUSE_DIR>/<schema>/<table>/ in the
  # bintrail-iceberg volume.
  #
  # A SEPARATE one-shot on purpose: the export writes a new copy of the data
  # and never runs inside the capture daemon, so a long export cannot slow
  # capture down. Uses the CORE image, because the console image deliberately
  # ships without the export commands.
  iceberg-export:
    profiles: ["iceberg-export"]
    image: ghcr.io/dbtrail/bintrail:${BINTRAIL_TAG:-latest}
    # Root, for the same reason index-init is: a freshly created named volume
    # is root-owned, and there is no earlier step here to hand it to the
    # image's non-root uid. The tables it writes are therefore root-owned,
    # which matters only if you point WAREHOUSE_DIR at a bind mount.
    user: "0:0"
    environment:
      # Bring your own index (default: the bundled MySQL, DSN built from the
      # generated password in the secret volume).
      INDEX_DSN: ${INDEX_DSN:-}
      # Where the baseline snapshots are. The default is where the `baseline`
      # profile writes them, in the state volume mounted read-only below.
      BASELINE_DIR: ${BASELINE_DIR:-/var/lib/bintrail/baselines}
      # Set this instead to read snapshots from S3; it wins over BASELINE_DIR.
      BASELINE_S3: ${BASELINE_S3:-}
      # Where the Iceberg tables are written, inside the volume below.
      WAREHOUSE_DIR: ${WAREHOUSE_DIR:-/var/lib/bintrail-iceberg}
      # Optional comma-separated schema.table list (empty = every table in the
      # newest baseline snapshot).
      ICEBERG_TABLES: ${ICEBERG_TABLES:-}
      # Needed when the baselines or the archived partitions this export folds
      # live in S3. Same passthrough as the console service.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      BINTRAIL_S3_ENDPOINT: ${BINTRAIL_S3_ENDPOINT:-}
      BINTRAIL_S3_PATH_STYLE: ${BINTRAIL_S3_PATH_STYLE:-}
    volumes:
      # Read-only: this reads baselines and writes nowhere but the warehouse.
      - bintrail-state:/var/lib/bintrail:ro
      - bintrail-iceberg:/var/lib/bintrail-iceberg
      - bintrail-index-secret:/run/secret:ro
    depends_on:
      index-mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Build the bundled-index DSN from the generated password unless the
        # operator brought their own. Plain assignment under `set -e` so an
        # unreadable secret aborts loud (see the bintrail service for why).
        if [ -z "$$INDEX_DSN" ]; then
          INDEX_DSN="root:$$(cat /run/secret/index_password)@tcp(index-mysql:3306)/bintrail_index"
        fi
        if [ -n "$$BASELINE_S3" ]; then
          set -- --baseline-s3 "$$BASELINE_S3"
        else
          # An empty or missing directory is not "nothing to do": the export
          # loads its first copy of every table from a snapshot, so without
          # one it can only fail. Say which directory, and what makes one.
          if [ ! -d "$$BASELINE_DIR" ]; then
            echo "FATAL: no baseline snapshots at $$BASELINE_DIR." >&2
            echo "  Take one first:  docker compose --profile baseline run --rm baseline" >&2
            echo "  Or set BASELINE_S3 to a prefix that already holds snapshots." >&2
            exit 1
          fi
          set -- --baseline-dir "$$BASELINE_DIR"
        fi
        [ -n "$$ICEBERG_TABLES" ] && set -- "$$@" --tables "$$ICEBERG_TABLES"
        mkdir -p "$$WAREHOUSE_DIR"
        exec bintrail export iceberg --index-dsn "$$INDEX_DSN" \
          "$$@" --warehouse "$$WAREHOUSE_DIR"

  # ── `drill` profile: scratch MySQL for `bintrail drill` (#1195) ──────────
  # An opt-in THROWAWAY server the restore rehearsal loads into. Same pinned
  # MySQL 8.4 as the bundled index (the SHIP carve-out); the bintrail binary
  # never launches or supervises it — it only loads into the DSN:
  #   docker compose --profile drill up -d drill-mysql
  #   bintrail drill --target-dsn "root:${DRILL_MYSQL_PASSWORD:-drill}@tcp(127.0.0.1:13307)/" ...
  #   # wipe ONLY the scratch afterwards (never `down -v`: that also removes
  #   # the index volumes — the system of record):
  #   docker compose --profile drill rm -sf drill-mysql
  #   docker volume rm <project>_drill-scratch-data
  drill-mysql:
    profiles: ["drill"]
    image: mysql:8.4.9
    environment:
      # Scratch-only credential — loopback-mapped below, holds throwaway data.
      MYSQL_ROOT_PASSWORD: ${DRILL_MYSQL_PASSWORD:-drill}
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - drill-scratch-data:/var/lib/mysql
