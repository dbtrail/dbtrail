# Builds and publishes the bintrail-demo evaluation image (#350).
#
# Separate from the GoReleaser pipeline on purpose: the demo image
# apt-installs MySQL + ProxySQL, and a demo-image build failure must not
# block a bintrail release. Triggered by the v* tag push itself — NOT by
# `release: published`: GoReleaser creates the GitHub release with the
# default GITHUB_TOKEN, and events generated by that token never trigger
# other workflows (GitHub's anti-recursion guard), so a release-published
# trigger silently never fires. Verified the hard way on v0.8.0.
#
# Manual runs take an explicit existing tag (workflow_dispatch input) so
# a dispatch can never publish an unversioned branch build.
#
# Publish gate (#971): each arch's pushed digest is BOOTED on its native
# runner (the `smoke` job, reusing demo/image/smoke-test.sh) before
# `merge` tags and cosign-signs the manifest list. The build proves the
# image compiles; the demo's real failure modes are runtime-only
# (Percona apt drift, entrypoint ordering, ProxySQL handshake), so the
# GHCR image tag must not exist until the container has answered the
# acceptance time-travel query on both arches. (The v* GIT tag triggers
# this workflow, so it necessarily already exists — what the gate
# withholds is the image tag and the signature.)
#
# NOTE: like ghcr.io/dbtrail/bintrail, the bintrail-demo package is
# created PRIVATE on first push and needs a one-time manual flip to
# public before anonymous `docker run` works (see docs/docker.md).
name: demo-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build (e.g. v0.8.0)"
        required: true
        type: string

# Default for every job: read-only. packages:write lives on the two jobs
# that push to ghcr.io; id-token:write only on `merge`, which cosign-signs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/dbtrail/bintrail-demo

jobs:
  # Build each arch on its OWN native runner instead of QEMU-emulating arm64
  # on an amd64 host: the bintrail binary links DuckDB via CGO (a large C++
  # compile) and emulated it can take 30+ min / OOM. Each leg pushes a
  # tagless image BY DIGEST; the `merge` job stitches the digests into one
  # multi-arch manifest list. (Docker's documented multi-runner pattern.)
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push per-arch images by digest to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `smoke` job's matrix: `merge` publishes
        # EVERY digest artifact (pattern: digests-*), but only the
        # platforms listed THERE get boot-tested — an arch added here
        # alone would ship unsmoked.
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On dispatch, build the tag's tree (checkout fails loudly if
          # the input names a tag that doesn't exist). On tag push this
          # is the pushed ref anyway.
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demo/image/Dockerfile
          # Percona Server 8.0 + ProxySQL 2.6 both ship arm64 packages, so
          # the demo builds natively on each arch (no cross-compile).
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push by digest only (no tag here); the merge job applies tags.
          # SBOM + provenance attestations (#976): each per-arch push becomes
          # a small OCI index — the arch image plus BuildKit attestation
          # manifests (platform "unknown/unknown"). `docker run` resolves the
          # native-arch image from that index, so the smoke job still boots
          # the exact pushed bytes via this digest, and `imagetools create`
          # in the merge job folds the per-arch entries — attestations
          # included — into the final manifest list (Docker's documented
          # multi-runner pattern). mode=min keeps build args and env out of
          # the provenance statement. The cosign signature on the merged
          # index (merge job) remains the integrity anchor.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Guard against an empty/malformed build output silently producing
          # a bad artifact filename that would poison the merge.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected build digest: '$DIGEST'"; exit 1; }
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Boot-test each arch's pushed digest on its NATIVE runner before
  # anything is tagged or signed (#971). Reuses demo/image/smoke-test.sh
  # (SKIP_BUILD=1 + IMAGE=<ref>@<digest>) instead of re-encoding the
  # readiness/time-travel checks in YAML — a second copy of the same
  # check is how guards rot. Testing the per-arch digests is equivalent
  # to testing the final index: `imagetools create` in `merge` only
  # assembles pointers to these same digests. Gating BEFORE merge is
  # strictly stronger than the issue's "fail before cosign-signing":
  # on a boot failure the version IMAGE tag (:X.Y.Z / :latest) is never
  # created at all.
  smoke:
    runs-on: ${{ matrix.runner }}
    needs: build
    # smoke-test.sh self-bounds at ~6 min, but the ghcr pull and the
    # docker execs are unbounded — without this, a hung pull presents
    # as "stuck" for the 6h default while gating the publish.
    timeout-minutes: 15
    permissions:
      contents: read # checkout: smoke-test.sh + the demo/image/ files its static guards grep
      packages: read # pull the per-arch image by digest from ghcr.io
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `build` job's matrix — an arch built but
        # not listed here would be published by `merge` without ever
        # having booted.
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same tree the build legs used (see the build job's checkout).
          ref: ${{ inputs.tag || github.ref }}

      # This leg's digest travels as the artifact's FILENAME (see the
      # build job's "Export digest"). download-artifact fails loudly if
      # the named artifact is missing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the pushed digest and run the smoke test
        run: |
          set -euo pipefail
          # failglob: an empty digests dir aborts here (same guard as the
          # merge job) instead of smoking a bogus ref.
          shopt -s failglob
          files=("${{ runner.temp }}/digests"/*)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one digest file, got ${#files[@]}: ${files[*]}"; exit 1; }
          DIGEST="sha256:$(basename "${files[0]}")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: '$DIGEST'"; exit 1; }
          # smoke-test.sh drives its acceptance queries with the mysql
          # client; not every runner image ships it (arm in particular).
          command -v mysql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          }
          # SKIP_BUILD=1 runs the EXACT bytes the build leg pushed —
          # `docker run` pulls the digest ref on its own. The script
          # boots the container, waits for the stack, checks the
          # telemetry guard, and asserts all three time-travel forms.
          SKIP_BUILD=1 IMAGE="${IMAGE}@${DIGEST}" demo/image/smoke-test.sh

  merge:
    runs-on: ubuntu-22.04
    # smoke: no tag, no signature, unless both arches booted and served
    # the acceptance query (#971).
    needs: [build, smoke]
    permissions:
      packages: write # push the merged manifest list to ghcr.io
      id-token: write # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            # :latest stays off prereleases (tags containing '-', e.g.
            # v0.8.0-rc1), mirroring skip_push: auto on the main image's
            # manifest in .goreleaser.yaml.
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Create multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # failglob: an empty digests dir aborts here instead of passing a
          # literal `*` to imagetools as a bogus source ref.
          shopt -s failglob
          # Intentional word-splitting: expand to multiple -t flags and
          # multiple image@digest args (Docker's documented merge idiom).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect, verify both arches, and sign
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          # Guard the PR's core promise: the published index MUST carry both
          # arches. A partial build (one matrix leg's digest missing) would
          # otherwise tag+sign a single-arch manifest green — exactly the
          # regression this image's multi-arch support exists to prevent.
          # BuildKit SBOM/provenance attestation manifests also appear here
          # as "unknown/unknown" entries (#976) — expected; the check below
          # only requires the two real arches to be present.
          PLATFORMS=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "manifest platforms: ${PLATFORMS}"
          for want in linux/amd64 linux/arm64; do
            case " ${PLATFORMS} " in *" ${want} "*) ;; *) echo "published manifest is missing ${want}"; exit 1 ;; esac
          done
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected index digest: '$DIGEST'"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"
