name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default for every job: read-only. The `changes` job overrides with the
# pull-requests read it needs for dorny/paths-filter.
permissions:
  contents: read

jobs:
  # Detects which parts of the tree changed so the expensive jobs below can
  # skip themselves on PRs that can't possibly affect them (e.g. a console
  # JS/CSS-only change has no way to break the MySQL/MariaDB/Postgres capture
  # path). NEVER add a top-level `on.pull_request.paths`/`paths-ignore` filter
  # here — all of unit/integration/integration-mariadb-source/
  # integration-postgres-source/console-e2e are REQUIRED status checks on
  # main's branch protection, and a workflow that never triggers at all never
  # reports those contexts, leaving a PR stuck on "Expected — waiting for
  # status to be reported" forever.
  #
  # Non-matrix jobs (unit, integration-mariadb-source, console-e2e) use a
  # JOB-level `if:` — its context name has no suffix, so a skipped job still
  # reports under the exact name branch protection expects, which GitHub
  # treats as satisfying the required check.
  #
  # Matrix jobs (integration, integration-postgres-source) do NOT: a job-level
  # `if:` is evaluated BEFORE matrix expansion, so a false condition means the
  # matrix never expands and the specifically-suffixed required contexts
  # (`integration (8.0)`, `integration-postgres-source (14)`, etc.) never get
  # created at all — verified live via a throwaway PR, whose mergeStateStatus
  # stayed BLOCKED with those 6 contexts permanently missing even though every
  # other job showed "skipped". Those two jobs instead push the same `if:`
  # down to every step, so the matrix still expands into the correctly-named
  # contexts and each just completes instantly with nothing executed.
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'migrations/**'
              - 'test/console-e2e/**'
              - '.github/workflows/ci.yml'
            console:
              - 'internal/console/**'
              - 'cmd/bintrail-console/**'
              - 'consoleapp/**'

  unit:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.console == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      # Staleness guard for THIRD-PARTY-NOTICES (license compliance, #428).
      # Keys off `go list -m all` (the module graph), NOT a go-licenses regen:
      # regenerating in CI would mean a slow CGO build on every PR plus
      # cross-platform nondeterminism (per-OS duckdb binding modules). If a
      # dependency was added/removed/bumped without `make notices`, this fails
      # with an actionable message.
      - name: THIRD-PARTY-NOTICES staleness check
        run: make check-notices

      # OFL-1.1 metadata guard (#1360): every vendored console woff2 must
      # carry its copyright + license name records (IDs 0/13/14) — the
      # machine-readable half of OFL §2, which pyftsubset's default
      # --name-IDs silently drops. python3-only; no Go build.
      - name: Font license metadata check
        run: make check-fonts

      - name: gofmt (warning-only)
        # The repo has pre-existing unformatted files; surface the list as a
        # warning but do not fail CI on it. Tighten to a hard fail once the
        # backlog is cleared.
        run: gofmt -l . || true
        continue-on-error: true

      - name: Unit tests
        # BINTRAIL_REQUIRE_DUCKDB_ICEBERG=1: the Iceberg export tests read
        # their tables back with DuckDB's iceberg extension, which the
        # embedded engine installs from the network on first use. Required
        # here so that leg never silently skips in CI.
        #
        # BINTRAIL_REQUIRE_NODE=1: one console test EXECUTES the JavaScript
        # that renders the Iceberg export command, under node. It is the only
        # coverage that runs that renderer rather than matching strings over
        # it, and node is here only because the runner image ships it, so
        # require it explicitly instead of skipping on its absence.
        #
        # BINTRAIL_REQUIRE_DUCKDB_HTTPFS=1: the SQL panel's setup-budget tests
        # put a Parquet footer read behind an HTTP server, which needs the
        # httpfs extension (installed from the same network as iceberg above).
        # They are the only coverage that bound has, so a silent skip here
        # would leave it unguarded in the one environment that must guard it.
        env:
          BINTRAIL_REQUIRE_DUCKDB_ICEBERG: "1"
          BINTRAIL_REQUIRE_DUCKDB_HTTPFS: "1"
          BINTRAIL_REQUIRE_NODE: "1"
        run: go test ./... -race -count=1

  integration:
    needs: changes
    runs-on: ubuntu-22.04

    # Two supported cells: the BYO contract floor (8.0) and the bundled index
    # engine (8.4, where mysql_native_password is disabled by default so every
    # connection authenticates with caching_sha2_password over the plaintext
    # network). Running the whole suite on 8.4 is what proves the native_password-
    # OFF default doesn't break the up→stream→query→shim pipeline; the focused
    # TestCachingSha2ColdAuthSeam additionally guards the cold full-auth path on
    # both cells. fail-fast: false so a regression on one version still reports
    # the other.
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]

    env:
      # Matches internal/testutil.DefaultDSN — set explicitly to mirror the
      # SaaS repo's `agent/` job and make the wiring obvious in logs.
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      # A MySQL server is guaranteed present in this job (started below), so
      # SkipIfNoMySQL must FAIL (not silently skip) on a dial/ping failure —
      # otherwise a DSN or build-tag drift would exit 0 green with ZERO
      # coverage of the flagship capture->index->query->recover pipeline.
      # Mirrors BINTRAIL_REQUIRE_MARIADB / BINTRAIL_REQUIRE_POSTGRES (#949).
      BINTRAIL_REQUIRE_MYSQL: "1"
      # The Iceberg export's integration leg reads its tables back with
      # DuckDB's iceberg extension; require it so the read-back never skips.
      BINTRAIL_REQUIRE_DUCKDB_ICEBERG: "1"

    steps:
      # Step-level (not job-level) `if:` — see the note on the `changes` job.
      # This job has a matrix, and a job-level `if:` evaluated before matrix
      # expansion, which means the specifically-named required contexts
      # (`integration (8.0)`, `integration (8.4)`) never got created at all
      # on a skipped run, leaving those required checks permanently pending.
      # Step-level `if:` lets the matrix still expand into both contexts;
      # each just completes instantly with every step skipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod

      # Start MySQL as a manually-named container rather than a `services:`
      # block. The integration tests `docker cp` raw binlog files out of a
      # container named exactly `bintrail-test-mysql`, and they need ROW-format
      # binlogs with a known basename — neither of which a `services:` block can
      # provide (service containers get auto-generated names and can't take
      # command-line args). This mirrors the local setup in CONTRIBUTING.md so
      # CI and developer machines run against an identical container.
      - name: Start MySQL (bintrail-test-mysql, ${{ matrix.mysql }})
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:${{ matrix.mysql }} \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --log-bin=binlog \
            --server-id=1
          echo "Waiting for MySQL to accept connections..."
          # Probe over the SAME path the tests use — host TCP 127.0.0.1:13306
          # with full auth and a real query — NOT `docker exec ... mysqladmin
          # ping`, which answers over the container's local socket. The
          # official mysql image runs a TEMPORARY mysqld during first-init
          # (to create the root user / run init scripts), then shuts it down
          # and starts the real one; a socket-local ping can succeed against
          # that temporary server and exit this loop while the real server on
          # the mapped host port is still starting or mid-restart — the
          # readiness race behind #949's `integration (8.0)` failure
          # (TestEndToEnd_fullPipeline: "unexpected EOF" / "invalid
          # connection" dialing 127.0.0.1:13306). Requiring THREE consecutive
          # successful probes (not just one) rules out a probe that landed on
          # the temporary server moments before the restart. The probe runs
          # from a short-lived container on the SAME image tag as the server
          # so it doesn't depend on whatever mysql client (if any) happens to
          # be preinstalled on the runner.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "mysql:${{ matrix.mysql }}" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                echo "MySQL is ready (3 consecutive successful probes)."
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      # -p 1 serializes package execution. Integration tests share one MySQL
      # instance with a single server-wide binlog; running packages in parallel
      # lets one package's DDL/DML leak into another's binlog window (the binlog
      # parser tests assert exact event counts). Serializing keeps each package
      # the sole writer during its run.
      #
      # BINTRAIL_REQUIRE_MYSQL=1 (above) only catches a dial/ping failure INSIDE
      # a test that actually runs — a build-tag or path drift that silently
      # dropped the integration tests from this run would still exit 0 green
      # with ZERO MySQL coverage. Close that false-green the same way the
      # PostgreSQL-source job does: assert the flagship end-to-end and
      # caching_sha2 auth-seam tests genuinely ran, not merely that `go test`
      # exited 0. pipefail keeps the go-test exit code through the tee.
      # (The paragraph above documents the integration-test step further down.)
      #
      # An S3-compatible store for the #1453/#1454 leg: the SDK half uploads
      # through BINTRAIL_S3_ENDPOINT and the DuckDB half reads the object back
      # through the session's endpoint settings. Throwaway root credentials;
      # the container is gone with the runner.
      - name: Start MinIO (bintrail-test-minio)
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          docker run -d --name bintrail-test-minio \
            -e MINIO_ROOT_USER=bintrail \
            -e MINIO_ROOT_PASSWORD=bintrail-it-secret \
            -p 9000:9000 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null || { docker logs bintrail-test-minio; exit 1; }

      - name: Integration tests (-tags=integration)
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        env:
          BINTRAIL_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
          BINTRAIL_TEST_MINIO_ACCESS_KEY: bintrail
          BINTRAIL_TEST_MINIO_SECRET_KEY: bintrail-it-secret
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v ./... 2>&1 | tee /tmp/mysql-it.out
          grep -q -- '--- PASS: TestS3Compat_MinIO' /tmp/mysql-it.out \
            || { echo "FATAL: S3-compatible (MinIO) leg did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestEndToEnd_fullPipeline' /tmp/mysql-it.out \
            || { echo "FATAL: MySQL end-to-end integration test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestCachingSha2ColdAuthSeam' /tmp/mysql-it.out \
            || { echo "FATAL: caching_sha2 cold-auth seam test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationCrashRestartExactlyOnce_position' /tmp/mysql-it.out \
            || { echo "FATAL: crash→restart exactly-once test did not run — false-green tripwire" >&2; exit 1; }

  integration-mariadb-source:
    # MariaDB-as-source alpha. A MariaDB-source test pairs a NEW MariaDB SOURCE
    # container (13307) with the existing MySQL INDEX container (13306) — two
    # containers a single matrix cell of the `integration` job cannot host, and
    # bolting MariaDB into that job would also perturb the shared-binlog window
    # the parser count-assertions depend on (#415). So it gets its own job, and
    # the 8.0/8.4 matrix above stays byte-identical. Runs only the MariaDB-named
    # tests (-run); the MySQL-only MariaDB tests (sqlmock/index-side) also run in
    # the matrix job, where the live-replication test skips for lack of a source.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-22.04

    # Spans the supported MariaDB range (#622): 10.6 LTS (declared minimum)
    # through 10.11 LTS and 11.4. fail-fast: false so a regression on one
    # version still reports the others, matching the PostgreSQL matrix. No
    # per-version server args are needed: the `mariadb` client name, the
    # MARIADB_ROOT_PASSWORD image env, gtid_strict_mode, log_bin_compress and
    # the ON default of binlog_annotate_row_events all hold from 10.6 up.
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.6", "10.11", "11.4"]

    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      BINTRAIL_TEST_MARIADB_DSN: "root:testroot@tcp(127.0.0.1:13307)"
      # A MariaDB source is guaranteed present in this job, so the MariaDB tests
      # must FAIL (not silently skip) if they can't run — otherwise a handshake
      # regression would pass as green-via-skip. The 8.0/8.4 matrix leaves this
      # unset, so the same tests skip politely there.
      BINTRAIL_REQUIRE_MARIADB: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start MariaDB source (bintrail-test-mariadb, ${{ matrix.mariadb }})
        run: |
          docker run -d --name bintrail-test-mariadb \
            -e MARIADB_ROOT_PASSWORD=testroot \
            -p 13307:3306 \
            mariadb:${{ matrix.mariadb }} \
            --log-bin=mariadb-bin --binlog-format=ROW --binlog-row-image=FULL \
            --server-id=2 --gtid-strict-mode=ON
          # Same socket-vs-TCP readiness race as the MySQL-start steps (#949):
          # probe host TCP with full auth + a real query, 3 consecutive
          # successes, instead of `docker exec ... mariadb-admin ping`.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mariadb:${{ matrix.mariadb }} \
                 mariadb --protocol=TCP -h 127.0.0.1 -P 13307 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MariaDB source is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready in time" >&2
          docker logs bintrail-test-mariadb >&2 || true
          exit 1

      # -run selects the MariaDB-named tests across all packages; -p 1 serializes
      # so the shared binlog window stays single-writer (same rationale as the
      # MySQL integration job).
      - name: MariaDB-source integration tests
        run: go test -tags=integration -race -p 1 -count=1 -run 'MariaDB|Mariadb|mariadb|Flavor|FourColumns' ./...

  integration-postgres-source:
    # PostgreSQL-as-source (#534). Like integration-mariadb-source, this pairs a
    # NEW PostgreSQL SOURCE container with the existing MySQL INDEX container
    # (13306): two containers a single `integration` matrix cell can't host, and
    # the PG logical-replication tests need wal_level=logical + replication slots
    # the MySQL index container can't provide. The end-to-end test
    # (TestOne_EndToEnd_PostgresToIndexToRecovery) streams PG changes INTO the
    # MySQL index and generates recovery SQL, so both servers must be present.
    needs: changes
    runs-on: ubuntu-22.04

    # Spans the supported PostgreSQL range: 14 (declared minimum — PG13 is EOL)
    # through 17. fail-fast: false so a regression on one version still reports
    # the others, matching the MySQL matrix. (PG18-specific stream changes — e.g.
    # STORED generated columns now in the WAL — are tracked with the beta work.)
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]

    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      # Host port 15432 (not 5432) avoids colliding with any PostgreSQL the
      # runner image ships; the container-internal port stays 5432. sslmode is
      # disabled — the stock postgres image serves plaintext. replDSN appends
      # replication=database onto this for the WAL connection.
      BINTRAIL_TEST_PG_DSN: "postgres://postgres:testpg@127.0.0.1:15432/pgtest?sslmode=disable"
      # A PostgreSQL source is guaranteed present here, so the PG tests must FAIL
      # (not silently skip) if the DSN is missing — guards against green-via-skip.
      # The 8.0/8.4 matrix and console-e2e leave it unset, so PG tests skip there.
      BINTRAIL_REQUIRE_POSTGRES: "1"

    steps:
      # Step-level (not job-level) `if:` — see the note on the `integration`
      # job above; this job's matrix has the same requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start PostgreSQL source (bintrail-test-postgres, ${{ matrix.postgres }})
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          docker run -d --name bintrail-test-postgres \
            -e POSTGRES_PASSWORD=testpg \
            -e POSTGRES_DB=pgtest \
            -p 15432:5432 \
            postgres:${{ matrix.postgres }} \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          # Probe TCP from inside the container: during first-init the entrypoint
          # runs a temporary unix-socket-only server, so a TCP (-h 127.0.0.1)
          # pg_isready only succeeds once the REAL server is up — avoiding the
          # false-ready race a socket probe would hit.
          for i in $(seq 1 60); do
            if docker exec bintrail-test-postgres pg_isready -h 127.0.0.1 -U postgres -d pgtest --quiet 2>/dev/null; then
              echo "PostgreSQL source is ready."; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs bintrail-test-postgres >&2 || true
          exit 1

      # Scoped to the two PostgreSQL packages by path (not -run) so the selection
      # is naming-independent — it won't accidentally catch a future TestOne_*-
      # style test added elsewhere. -p 1 serializes (the tests share one server,
      # creating/dropping their own slots/publications).
      #
      # Both packages ALSO hold non-tagged unit tests, so a build-tag or path
      # drift that silently dropped the integration tests would still exit 0
      # green with ZERO PG coverage (the BINTRAIL_REQUIRE_POSTGRES guard only
      # fires when an integration test actually runs). Close that false-green by
      # asserting the headline end-to-end test genuinely ran — not merely that
      # `go test` exited 0. pipefail keeps the go-test exit code through the tee.
      - name: PostgreSQL-source integration tests
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v \
            ./internal/pgcapture/ ./internal/pgstreamrun/ ./internal/pgbaseline/ ./internal/pgshim/ 2>&1 | tee /tmp/pg-it.out
          grep -q -- '--- PASS: TestOne_EndToEnd_PostgresToIndexToRecovery' /tmp/pg-it.out \
            || { echo "FATAL: PG end-to-end integration test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestPGBaseline_Integration' /tmp/pg-it.out \
            || { echo "FATAL: pgbaseline integration suite did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestPGWire_PostgresSourceRoundTrip' /tmp/pg-it.out \
            || { echo "FATAL: pgwire PostgreSQL-source E2E did not run — false-green tripwire" >&2; exit 1; }

  integration-postgres-extensions:
    # Extension-type round-trip coverage (#1210): PostGIS geometry/geography
    # and pgvector's vector are text-decoded through pgoutput like any other
    # type, but the plain postgres:N images above cannot host the extensions —
    # so this job pairs the same MySQL index container with one extension-
    # bearing PostgreSQL image per cell (no single stock image ships both
    # extensions) and runs ONLY the extension matrix test; the full PG suite
    # already runs in integration-postgres-source. One modern PG major per
    # extension, not a full version matrix: the extension's text I/O is what's
    # under test, not the server version (that axis is covered above).
    #
    # BINTRAIL_REQUIRE_PGEXT names the extension each cell guarantees, turning
    # the test's per-extension skip into a FAILURE here — plus the usual
    # PASS-line tripwire, so a renamed test cannot go green-via-empty `-run`.
    needs: changes
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "postgis/postgis:16-3.4"
            ext: "postgis"
          - image: "pgvector/pgvector:pg16"
            ext: "vector"
    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      BINTRAIL_TEST_PG_DSN: "postgres://postgres:testpg@127.0.0.1:15432/pgtest?sslmode=disable"
      BINTRAIL_REQUIRE_POSTGRES: "1"
      BINTRAIL_REQUIRE_PGEXT: ${{ matrix.ext }}
    steps:
      # Step-level (not job-level) `if:` — see the note on the `integration`
      # job above; this job's matrix has the same requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start PostgreSQL source (bintrail-test-postgres, ${{ matrix.image }})
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          docker run -d --name bintrail-test-postgres \
            -e POSTGRES_PASSWORD=testpg \
            -e POSTGRES_DB=pgtest \
            -p 15432:5432 \
            ${{ matrix.image }} \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          # Same in-container TCP probe as integration-postgres-source (the
          # postgis/pgvector images reuse the official postgres entrypoint,
          # first-init unix-socket-only phase included).
          for i in $(seq 1 60); do
            if docker exec bintrail-test-postgres pg_isready -h 127.0.0.1 -U postgres -d pgtest --quiet 2>/dev/null; then
              echo "PostgreSQL source is ready."; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs bintrail-test-postgres >&2 || true
          exit 1

      - name: Extension-type round-trip test (${{ matrix.ext }})
        if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v \
            -run 'TestOne_PGExtensionTypeRoundTripMatrix' ./internal/pgstreamrun/ 2>&1 | tee /tmp/pgext-it.out
          grep -q -- '--- PASS: TestOne_PGExtensionTypeRoundTripMatrix' /tmp/pgext-it.out \
            || { echo "FATAL: PG extension-type round-trip test did not run — false-green tripwire" >&2; exit 1; }

  console-e2e:
    # Headless-Chrome regression guard for the console SPA: go test never
    # renders assets/*, so CSS/DOM/presentation bugs (invisible buttons, a
    # form that auto-expands, a raw error wall, the control plane vanishing on
    # a broken server selection) are invisible to the Go suite. Each scenario
    # pins a bug that shipped in 0.13.3.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.console == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Same manually-named container as the integration job (8.4 = the bundled
      # index engine, caching_sha2_password default).
      - name: Start MySQL (bintrail-test-mysql, 8.4)
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Install playwright chromium (+ system deps)
        run: |
          npm --prefix test/console-e2e install --no-audit --no-fund
          npx --prefix test/console-e2e playwright install --with-deps chromium

      # PW_CHANNEL unset → use the chromium installed above (not system Chrome).
      - name: Console E2E (headless Chrome)
        run: make console-e2e

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-e2e-failure
          path: |
            ${{ runner.temp }}/console-e2e-failure.png
            ${{ runner.temp }}/console-e2e-daemon.log
          if-no-files-found: ignore

  # The .goreleaser.yaml signs block only ever executes on a tag push, so no
  # PR check can catch a broken flag set until a release run fails — the worst
  # possible moment (recovery is delete-tag, fix, re-tag; cosign v3 made the
  # Sigstore bundle sign-blob's default output, and an installer-action major
  # bump is what pulls a new cosign in). This job replays the EXACT cmd/args
  # from the config against a throwaway file, with the same keyless OIDC flow
  # and the same cosign-installer pin the release uses, then verifies the
  # bundle it produced. A cosign bump or a signs-block edit that would break
  # the release now fails here instead (#1350). Fork PRs carry no id-token,
  # so they skip rather than fail; pushes and same-repo PRs (dependabot
  # included) always run it. No `changes` gate on purpose: it must fire on
  # workflow/config-only PRs, which the go filter would skip.
  signing:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # keyless signing via OIDC, same as the release job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action pin determines which cosign BINARY ships (v4.x of the
      # action installs cosign v3.x) — which is why the lockstep check below
      # insists ci.yml and release.yaml carry the same SHA.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Replay the signs block against a throwaway artifact
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          # What CI proves must be what the release runs: same action pin.
          # Comment-enforced lockstep rots silently; this does not.
          ci_pin="$(grep -oE 'cosign-installer@[0-9a-f]{40}' .github/workflows/ci.yml | sort -u)"
          rel_pin="$(grep -oE 'cosign-installer@[0-9a-f]{40}' .github/workflows/release.yaml | sort -u)"
          if [ "$ci_pin" != "$rel_pin" ]; then
            echo "cosign-installer pins diverged: ci.yml has '$ci_pin', release.yaml has '$rel_pin'" >&2
            exit 1
          fi

          artifact="$(mktemp)"
          echo "signing probe ${GITHUB_SHA}" > "$artifact"

          cmd="$(yq -r '.signs[0].cmd' .goreleaser.yaml)"
          sig_tpl="$(yq -r '.signs[0].signature // "${artifact}.sig"' .goreleaser.yaml)"
          cert_tpl="$(yq -r '.signs[0].certificate // ""' .goreleaser.yaml)"
          args_raw="$(yq -r '.signs[0].args[]' .goreleaser.yaml)"

          # Fail closed on template forms this replay does not implement: the
          # renderer below knows exactly ${artifact}/${signature}/${certificate}.
          # A {{ }} goreleaser template or an unknown ${} placeholder would
          # otherwise reach cosign as literal bytes — a green proving the
          # wrong invocation. Teach the renderer first, then use the form.
          probe="$(printf '%s\n%s\n%s\n%s' "$cmd" "$sig_tpl" "$cert_tpl" "$args_raw")"
          probe="${probe//\$\{artifact\}/}"
          probe="${probe//\$\{signature\}/}"
          probe="${probe//\$\{certificate\}/}"
          case "$probe" in *'{{'*|*'${'*)
            echo "signs block uses template forms the CI replay cannot render — teach the replay first" >&2
            exit 1 ;;
          esac

          signature=""
          certificate=""
          render() {
            local s="$1"
            s="${s//\$\{artifact\}/$artifact}"
            s="${s//\$\{signature\}/$signature}"
            s="${s//\$\{certificate\}/$certificate}"
            printf '%s' "$s"
          }
          signature="$(render "$sig_tpl")"
          certificate="$(render "$cert_tpl")"
          args=()
          while IFS= read -r a; do args+=("$(render "$a")"); done <<< "$args_raw"
          echo "replaying: $cmd ${args[*]}"
          "$cmd" "${args[@]}"
          test -s "$signature" || { echo "signs block produced no signature at $signature" >&2; exit 1; }

          # This run's Fulcio identity is THIS workflow's ref (ci.yml@...), so
          # that is what the verify pins. The user-facing recipe in
          # docs/install.md pins release.yaml@refs/tags/ instead and is
          # exercised by nothing here — review it by hand when it changes.
          cosign verify-blob \
            --bundle "$signature" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$artifact"
