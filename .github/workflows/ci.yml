name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run: every job and every matrix cell, whatever a PR's paths
  # let it skip. workflow_dispatch is the same full run on demand.
  #
  # Who hears about a failure: ci-alert.yml watches every run of this
  # workflow on main, push and nightly, and keeps one issue labelled
  # `ci-red-main` open while main is red (#1882). GitHub's own email is not
  # the alert. For a scheduled run it goes to one person only, whoever last
  # edited the cron line below, and only if that account has notifications
  # for Actions turned on. Eleven runs in a row failed that way in September
  # 2026 and three days went by.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in flight: only the newest
# commit's result can merge. Non-PR runs (push to main, nightly, manual) get a
# group of their own via run_id, so nothing ever cancels or queues them. A
# `github.ref` fallback would NOT be enough: with cancel-in-progress false,
# GitHub still drops a PENDING run when a newer one joins the same group, so
# two quick merges to main would silently lose the middle run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default for every job: read-only. The `changes` job overrides with the
# pull-requests read it needs for dorny/paths-filter.
permissions:
  contents: read

jobs:
  # Detects which parts of the tree changed so the expensive jobs below can
  # skip themselves on PRs that can't possibly affect them (e.g. a console
  # JS/CSS-only change has no way to break the MySQL/MariaDB/Postgres capture
  # path). NEVER add a top-level `on.pull_request.paths`/`paths-ignore` filter
  # here — all of unit/integration/integration-mariadb-source/
  # integration-postgres-source/console-e2e are REQUIRED status checks on
  # main's branch protection, and a workflow that never triggers at all never
  # reports those contexts, leaving a PR stuck on "Expected — waiting for
  # status to be reported" forever.
  #
  # Non-matrix jobs (unit, console-e2e, console-first-run-walk) use a
  # JOB-level `if:` — its context name has no suffix, so a skipped job still
  # reports under the exact name branch protection expects, which GitHub
  # treats as satisfying the required check.
  #
  # Matrix jobs (integration, integration-mariadb-source,
  # integration-postgres-source, integration-postgres-extensions) do NOT: a
  # job-level `if:` is evaluated BEFORE matrix expansion, so a false condition
  # means the matrix never expands and the specifically-suffixed required contexts
  # (`integration (8.0)`, `integration-postgres-source (14)`, etc.) never get
  # created at all — verified live via a throwaway PR, whose mergeStateStatus
  # stayed BLOCKED with those 6 contexts permanently missing even though every
  # other job showed "skipped". Those jobs instead push the same `if:`
  # down to every step, so the matrix still expands into the correctly-named
  # contexts and each just completes instantly with nothing executed. Each of
  # those jobs computes its condition ONCE into a job-level `env.RUN` and every
  # step reads that, so a step that forgets the condition cannot slip in.
  #
  # Every gate below reads `github.event_name != 'pull_request'` first: that is
  # "push to main, nightly schedule or manual dispatch", the runs that execute
  # EVERYTHING. The filter itself runs only on pull_request (a schedule or
  # dispatch has no base to diff against), so its outputs are empty on the
  # other events and nothing may read them without the event check in front.
  #
  # `data` is the DATA PATH: capture and parsing (MySQL, MariaDB, Postgres),
  # indexing, query, recovery, reconstruct, archives, baselines, DuckDB, the
  # CLI, config and the module files. It is written as "every Go file EXCEPT
  # the ones that cannot reach a database source" so that a NEW package counts
  # as data path until someone decides otherwise. The exclusions are the web
  # console, the MCP server and its tools, telemetry and notifications, whose
  # own tests run in `unit`, the 8.4 `integration` cell and the console jobs.
  # On a PR, `data` decides whether the MariaDB and PostgreSQL source jobs
  # run and whether the MySQL 8.0 cell runs alongside 8.4.
  #
  # `dbgo` is `go` minus the console's browser-driven tests
  # (internal/console/assets_*_test.go: node over app.js, no database). It
  # decides whether the 8.4 cell runs at all: a PR that only touches the
  # console's assets and their tests used to pay the 15-minute MySQL leg
  # for nothing. What that leg also did for such a PR, compiling the
  # package under -tags integration, the unit job now does on its own
  # (`go vet -tags integration ./...`), so a test helper that redeclares
  # one from an integration test file still fails the PR (#1843).
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      dbgo: ${{ steps.filter.outputs.dbgo }}
      console: ${{ steps.filter.outputs.console }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # A file counts for a filter when it matches at least one pattern
          # and none of that filter's `!` patterns. Only `data` and `dbgo`
          # have any, so `go` and `console` behave exactly as with the
          # default.
          predicate-quantifier: some-with-excludes
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'docs/migrations/**'
              - 'test/console-e2e/**'
              # The first-run walk runs the permissions block from the
              # quickstart, read out of that file: a docs-only edit that
              # reshapes it breaks the walk, so it has to be able to run.
              - 'docs/quickstart.md'
              # A unit test reads the image recipes (#1876): a change to one
              # has to be able to run it.
              - '**/Dockerfile*'
              - '.github/workflows/ci.yml'
            dbgo:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'docs/migrations/**'
              - '.github/workflows/ci.yml'
              # The S3 test store actions run inside the integration job
              # (#1884): a change to one must be able to run that job.
              - '.github/actions/**'
              # What runs in which shard, and how one package is split by
              # test name: a change to it must run the shards.
              - 'scripts/mysql-integration-shard.sh'
              - '!internal/console/assets_*_test.go'
            console:
              - 'internal/console/**'
              - 'cmd/bintrail-console/**'
              - 'consoleapp/**'
            data:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'docs/migrations/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/mysql-integration-shard.sh'
              - '!internal/console/**'
              - '!consoleapp/**'
              - '!cmd/bintrail-console/**'
              - '!cmd/bintrail-mcp/**'
              - '!internal/mcptools/**'
              - '!ext/mcpext/**'
              - '!internal/telemetry/**'
              - '!internal/notify/**'
              - '!test/console-e2e/**'

  unit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.console == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      # The integration test files compile only under their tag, and the
      # MySQL cell no longer runs for a console-tests-only PR (`dbgo`), so
      # this is where a helper redeclared between a unit test and an
      # integration test file is caught (#1843). No database is needed to
      # compile them.
      - name: go vet (integration tag)
        run: go vet -tags integration ./...

      # Staleness guard for THIRD-PARTY-NOTICES (license compliance, #428).
      # Keys off `go list -m all` (the module graph), NOT a go-licenses regen:
      # regenerating in CI would mean a slow CGO build on every PR plus
      # cross-platform nondeterminism (per-OS duckdb binding modules). If a
      # dependency was added/removed/bumped without `make notices`, this fails
      # with an actionable message.
      - name: THIRD-PARTY-NOTICES staleness check
        run: make check-notices

      # OFL-1.1 metadata guard (#1360): every vendored console woff2 must
      # carry its copyright + license name records (IDs 0/13/14) — the
      # machine-readable half of OFL §2, which pyftsubset's default
      # --name-IDs silently drops. python3-only; no Go build.
      - name: Font license metadata check
        run: make check-fonts

      - name: gofmt (warning-only)
        # The repo has pre-existing unformatted files; surface the list as a
        # warning but do not fail CI on it. Tighten to a hard fail once the
        # backlog is cleared.
        run: gofmt -l . || true
        continue-on-error: true

      - name: Unit tests
        # BINTRAIL_REQUIRE_DUCKDB_ICEBERG=1: the Iceberg export tests read
        # their tables back with DuckDB's iceberg extension, which the
        # embedded engine installs from the network on first use. Required
        # here so that leg never silently skips in CI.
        #
        # BINTRAIL_REQUIRE_NODE=1: one console test EXECUTES the JavaScript
        # that renders the Iceberg export command, under node. It is the only
        # coverage that runs that renderer rather than matching strings over
        # it, and node is here only because the runner image ships it, so
        # require it explicitly instead of skipping on its absence.
        #
        # BINTRAIL_REQUIRE_DUCKDB_HTTPFS=1: the SQL panel's setup-budget tests
        # put a Parquet footer read behind an HTTP server, which needs the
        # httpfs extension (installed from the same network as iceberg above).
        # They are the only coverage that bound has, so a silent skip here
        # would leave it unguarded in the one environment that must guard it.
        env:
          BINTRAIL_REQUIRE_DUCKDB_ICEBERG: "1"
          BINTRAIL_REQUIRE_DUCKDB_HTTPFS: "1"
          BINTRAIL_REQUIRE_NODE: "1"
        run: go test ./... -race -count=1

  # The MySQL integration suite, split in shards that run side by side.
  # It used to be ONE job per MySQL version running every package one at a
  # time, about 25 minutes. Each shard is its own runner with its own MySQL
  # and S3 store, so packages inside a shard still run one at a time (they
  # share that server's binlog) while the shards overlap. What runs where, and
  # why only packages with integration-tagged tests, is in
  # scripts/mysql-integration-shard.sh: the last shard takes every package the
  # others do not name, so a new package can never go unrun. One package runs
  # in two shards, split by test name; the `integration` job checks that the
  # two parts add up to the package.
  #
  # These cells are NOT the required checks. `integration (8.0)` and
  # `integration (8.4)` are, and they are the `integration` job below, which
  # collects every shard's result and test log and fails unless all of them
  # ran and passed.
  integration-shard:
    needs: changes
    runs-on: ubuntu-22.04
    # A hung test must not hold a runner for the 6-hour default. The slowest
    # shard took about 12 minutes when this was written.
    timeout-minutes: 40

    # Two supported cells: the BYO contract floor (8.0) and the bundled index
    # engine (8.4, where mysql_native_password is disabled by default so every
    # connection authenticates with caching_sha2_password over the plaintext
    # network). Running the whole suite on 8.4 is what proves the native_password-
    # OFF default doesn't break the up→stream→query→shim pipeline; the focused
    # TestCachingSha2ColdAuthSeam additionally guards the cold full-auth path on
    # both cells. fail-fast: false so a regression on one version still reports
    # the other.
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
        # Must list 1..SHARD_COUNT of scripts/mysql-integration-shard.sh: the
        # script refuses a shard past its count, and the `integration` job
        # fails when a shard's result is missing.
        shard: [1, 2, 3]

    env:
      # Matches internal/testutil.DefaultDSN — set explicitly to mirror the
      # SaaS repo's `agent/` job and make the wiring obvious in logs.
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      # A MySQL server is guaranteed present in this job (started below), so
      # SkipIfNoMySQL must FAIL (not silently skip) on a dial/ping failure —
      # otherwise a DSN or build-tag drift would exit 0 green with ZERO
      # coverage of the flagship capture->index->query->recover pipeline.
      # Mirrors BINTRAIL_REQUIRE_MARIADB / BINTRAIL_REQUIRE_POSTGRES (#949).
      BINTRAIL_REQUIRE_MYSQL: "1"
      # This job's MySQL is its own, and its packages run one at a time, so a
      # test may change the server's GLOBAL time_zone and sql_mode (and put
      # them back): the read router's "source defaults" test needs it.
      BINTRAIL_TEST_ALLOW_SET_GLOBAL: "1"
      # The Iceberg export's integration leg reads its tables back with
      # DuckDB's iceberg extension; require it so the read-back never skips.
      BINTRAIL_REQUIRE_DUCKDB_ICEBERG: "1"
      # Whether this cell executes its steps (see the note on the `changes`
      # job). Everything on push/nightly/dispatch. On a PR that touches Go
      # outside the console's browser-driven tests (`dbgo`), 8.4 always
      # runs; 8.0 joins only when the PR touches the data path, and
      # otherwise reports as a success with nothing executed.
      RUN: ${{ github.event_name != 'pull_request' || (needs.changes.outputs.dbgo == 'true' && (matrix.mysql == '8.4' || needs.changes.outputs.data == 'true')) }}

    steps:
      # Step-level (not job-level) `if:`, as everywhere a matrix job reports
      # under the gate (see the note on the `changes` job).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version-file: go.mod

      # Start MySQL as a manually-named container rather than a `services:`
      # block. The integration tests `docker cp` raw binlog files out of a
      # container named exactly `bintrail-test-mysql`, and they need ROW-format
      # binlogs with a known basename — neither of which a `services:` block can
      # provide (service containers get auto-generated names and can't take
      # command-line args). This mirrors the local setup in CONTRIBUTING.md so
      # CI and developer machines run against an identical container.
      - name: Start MySQL (bintrail-test-mysql, ${{ matrix.mysql }})
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:${{ matrix.mysql }} \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --log-bin=binlog \
            --server-id=1
          echo "Waiting for MySQL to accept connections..."
          # Probe over the SAME path the tests use — host TCP 127.0.0.1:13306
          # with full auth and a real query — NOT `docker exec ... mysqladmin
          # ping`, which answers over the container's local socket. The
          # official mysql image runs a TEMPORARY mysqld during first-init
          # (to create the root user / run init scripts), then shuts it down
          # and starts the real one; a socket-local ping can succeed against
          # that temporary server and exit this loop while the real server on
          # the mapped host port is still starting or mid-restart — the
          # readiness race behind #949's `integration (8.0)` failure
          # (TestEndToEnd_fullPipeline: "unexpected EOF" / "invalid
          # connection" dialing 127.0.0.1:13306). Requiring THREE consecutive
          # successful probes (not just one) rules out a probe that landed on
          # the temporary server moments before the restart. The probe runs
          # from a short-lived container on the SAME image tag as the server
          # so it doesn't depend on whatever mysql client (if any) happens to
          # be preinstalled on the runner.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "mysql:${{ matrix.mysql }}" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                echo "MySQL is ready (3 consecutive successful probes)."
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      # A second MySQL, with GTIDs on, for the read-routing tests that need a
      # GTID source captured into an index on ANOTHER server (#2085): the
      # index of a source is never compared with it when both are one server,
      # and the main server above runs without GTIDs. Only in the shard that
      # runs the consoleapp TestIntegrationFlashback tests (SPLIT_RUN in
      # scripts/mysql-integration-shard.sh); if that split moves to another
      # shard, this step and the two variables below move with it, and the
      # `integration` job's "Key tests ran" step is what notices if they did
      # not (the tests skip without the server unless told it is required).
      - name: Start the GTID source (bintrail-test-mysql-gtid, ${{ matrix.mysql }})
        if: env.RUN == 'true' && matrix.shard == 2
        run: |
          docker run -d --name bintrail-test-mysql-gtid \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13316:3306 \
            mysql:${{ matrix.mysql }} \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --log-bin=binlog \
            --server-id=3 \
            --gtid-mode=ON \
            --enforce-gtid-consistency=ON
          # Three consecutive answers over the path the tests use, for the
          # reason given at the main server's start above.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "mysql:${{ matrix.mysql }}" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13316 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                echo "The GTID source is ready (3 consecutive successful probes)."
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "The GTID source did not become ready in time" >&2
          docker logs bintrail-test-mysql-gtid >&2 || true
          exit 1

      # An S3-compatible store for the #1453/#1454 leg: the SDK half uploads
      # through BINTRAIL_S3_ENDPOINT and the DuckDB half reads the object back
      # through the session's endpoint settings. The image, its pin and its
      # mirror live in .github/actions/s3-test-store (shared with
      # release.yaml). That action never fails: when the store cannot start
      # (the image was withdrawn twice in September 2026, #1884), the S3 tests
      # skip, every other test still runs, and the "S3-compatible leg" step
      # at the end turns this job red.
      - name: Start S3-compatible test store (bintrail-test-minio)
        id: s3store
        if: env.RUN == 'true'
        uses: ./.github/actions/s3-test-store

      # The shard's packages run one at a time against this job's MySQL: they
      # share one server-wide binlog, and running two at once lets one
      # package's DDL/DML leak into another's binlog window (the binlog parser
      # tests assert exact event counts). The script first builds the shard's
      # test binaries in parallel, which `go test -p 1` would build one by one.
      #
      # BINTRAIL_REQUIRE_MYSQL=1 (above) only catches a dial/ping failure INSIDE
      # a test that actually runs. That a shard's key tests really ran is
      # checked by the `integration` job, over every shard's log.
      - name: Integration tests (-tags=integration, shard ${{ matrix.shard }})
        id: tests
        if: env.RUN == 'true'
        env:
          BINTRAIL_TEST_MINIO_ENDPOINT: ${{ steps.s3store.outputs.endpoint }}
          BINTRAIL_TEST_MINIO_ACCESS_KEY: bintrail
          BINTRAIL_TEST_MINIO_SECRET_KEY: bintrail-it-secret
          # The GTID source started above, in the shard that has it. There a
          # test that needs it FAILS when it is missing instead of skipping.
          BINTRAIL_TEST_GTID_SOURCE_DSN: ${{ matrix.shard == 2 && 'root:testroot@tcp(127.0.0.1:13316)' || '' }}
          BINTRAIL_REQUIRE_GTID_SOURCE: ${{ matrix.shard == 2 && '1' || '' }}
        run: |
          mkdir -p /tmp/mysql-it-shard
          bash scripts/mysql-integration-shard.sh run ${{ matrix.shard }} /tmp/mysql-it-shard/mysql-it.out

      # What the `integration` job reads: this shard's test log, how its tests
      # step ended and whether its S3 store started. Written even when the
      # tests failed, so the collector can say which shard and why.
      - name: Record the shard result
        if: ${{ !cancelled() && env.RUN == 'true' }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          S3_READY: ${{ steps.s3store.outputs.ready }}
        run: |
          mkdir -p /tmp/mysql-it-shard
          touch /tmp/mysql-it-shard/mysql-it.out
          printf '%s\n' "$TESTS_OUTCOME" > /tmp/mysql-it-shard/outcome
          printf '%s\n' "${S3_READY:-false}" > /tmp/mysql-it-shard/s3-ready

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && env.RUN == 'true' }}
        with:
          name: mysql-it-${{ matrix.mysql }}-shard-${{ matrix.shard }}
          path: /tmp/mysql-it-shard/
          if-no-files-found: error
          retention-days: 7

  # The REQUIRED checks `integration (8.0)` and `integration (8.4)`: the name
  # and matrix are kept exactly so branch protection does not change. It runs
  # no tests; it collects the shards of its MySQL version and is green only
  # when every shard ran and passed, then runs the false-green tripwires and
  # the S3 check over all their logs together. `!cancelled()` makes it report
  # even when a shard failed, which a plain `needs:` would turn into "skipped"
  # (and a skipped required check counts as passing).
  integration:
    needs: [changes, integration-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    env:
      # The same gate as integration-shard: when a cell's shards were told to
      # skip, so is this.
      RUN: ${{ github.event_name != 'pull_request' || (needs.changes.outputs.dbgo == 'true' && (matrix.mysql == '8.4' || needs.changes.outputs.data == 'true')) }}
    steps:
      # A failed `changes` job leaves every output empty, which reads as
      # "skip" on a PR: refuse instead of passing on nothing.
      - name: The changes job finished
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::the changes job ended '$CHANGES_RESULT', so it is unknown whether the MySQL ${{ matrix.mysql }} tests had to run"
            exit 1
          fi
          if [ "$RUN" != true ]; then
            echo "MySQL ${{ matrix.mysql }} integration tests are not needed for this change (see the note on the changes job)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.RUN == 'true'
        with:
          pattern: mysql-it-${{ matrix.mysql }}-shard-*
          path: /tmp/mysql-it-shards

      # Every shard must have reported and passed. A missing result means the
      # shard was cancelled, crashed before writing it, or the matrix and
      # SHARD_COUNT disagree. Readiness of the S3 store is true only when it
      # started in EVERY shard: a shard whose store was down skipped its S3
      # tests.
      - name: Collect the shards (MySQL ${{ matrix.mysql }})
        id: s3store
        if: env.RUN == 'true'
        run: |
          count="$(bash scripts/mysql-integration-shard.sh count)"
          bad=0
          ready=true
          : > /tmp/mysql-it.out
          if [ -f /tmp/mysql-it-shards/outcome ]; then
            # download-artifact extracts flat when only ONE artifact matched.
            echo "::error::only one of $count shards reported a result"
            exit 1
          fi
          for i in $(seq 1 "$count"); do
            d="/tmp/mysql-it-shards/mysql-it-${{ matrix.mysql }}-shard-$i"
            if [ ! -f "$d/outcome" ]; then
              echo "::error::shard $i of $count left no result (cancelled, crashed, or not in the matrix)"
              bad=1
              ready=false
              continue
            fi
            outcome="$(cat "$d/outcome")"
            if [ "$outcome" != success ]; then
              echo "::error::shard $i of $count: tests ended '$outcome'; its log is in the integration-shard (${{ matrix.mysql }}, $i) job"
              bad=1
            fi
            [ "$(cat "$d/s3-ready")" = true ] || ready=false
            cat "$d/mysql-it.out" >> /tmp/mysql-it.out
          done
          extra="$(find /tmp/mysql-it-shards -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          if [ "$extra" -gt "$count" ]; then
            echo "::error::found $extra shard results, SHARD_COUNT is $count: the matrix and the script disagree"
            bad=1
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          grep -E '^(ok  |FAIL)'$'\t' /tmp/mysql-it.out || true
          exit "$bad"

      # One package (consoleapp) runs in two shards, split by test name: one
      # shard runs the tests a pattern matches, another the rest. Over both
      # logs together, every test its binary lists must have run exactly
      # once, so a change to the split can neither drop a test nor run it
      # twice (scripts/mysql-integration-shard.sh, SPLIT_PKG).
      - name: The split package ran whole
        if: env.RUN == 'true'
        run: bash scripts/mysql-integration-shard.sh check-split /tmp/mysql-it.out

      # The false-green tripwires: these tests must have PASSED in some shard,
      # not merely not failed. They live in different shards, so they are
      # checked here over every shard's log.
      - name: Key tests ran
        if: env.RUN == 'true'
        run: |
          grep -q -- '--- PASS: TestEndToEnd_fullPipeline' /tmp/mysql-it.out \
            || { echo "FATAL: MySQL end-to-end integration test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestCachingSha2ColdAuthSeam' /tmp/mysql-it.out \
            || { echo "FATAL: caching_sha2 cold-auth seam test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationGTIDReconnectAfterCommitIndexesOnce ' /tmp/mysql-it.out \
            || { echo "FATAL: GTID reconnect exactly-once test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationGTIDCrashBeforeFirstFileCheckpointIndexesOnce ' /tmp/mysql-it.out \
            || { echo "FATAL: GTID first-checkpoint crash test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationGTIDResetKeepsOlderHistory ' /tmp/mysql-it.out \
            || { echo "FATAL: GTID reset history-survival test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationGTIDCutMidTransactionIndexesOnce ' /tmp/mysql-it.out \
            || { echo "FATAL: GTID cut-mid-transaction test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationGTIDFreshStartCheckpointsAtOnce ' /tmp/mysql-it.out \
            || { echo "FATAL: GTID fresh-start checkpoint test did not run (false-green tripwire)" >&2; exit 1; }
          for name in \
            TestIntegrationGTIDResetMasterRestartBeforeRenumberingPasses \
            TestIntegrationGTIDResetMasterRestartAfterRenumberingPasses \
            TestIntegrationGTIDResetMasterCrashRightAfterRestart \
            TestIntegrationGTIDResetMasterWhileStreaming \
            TestIntegrationGTIDResetMasterFileNameReused \
            TestIntegrationGTIDCheckpointFromAnotherServer; do
            grep -q -- "--- PASS: $name " /tmp/mysql-it.out \
              || { echo "FATAL: GTID capture across a source RESET ($name) did not run (false-green tripwire)" >&2; exit 1; }
          done
          grep -q -- '--- PASS: TestIntegrationCrashRestartExactlyOnce_position' /tmp/mysql-it.out \
            || { echo "FATAL: crash→restart exactly-once test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationPositionResetMasterKeepsCapturedRows ' /tmp/mysql-it.out \
            || { echo "FATAL: position-mode RESET MASTER keep-rows test did not run: is the source in position mode? (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestOne_SourceFlavor_mysqlDeclaredMariaDBRefuses ' /tmp/mysql-it.out \
            || { echo "FATAL: source-flavor refusal test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestOne_SourceFlavor_mysqlDetectedWhenUndeclared ' /tmp/mysql-it.out \
            || { echo "FATAL: source-flavor detection test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationFlashbackRoutedUnchangedRealCapture_2085 ' /tmp/mysql-it.out \
            || { echo "FATAL: read routing by table over a real capture did not run: is the GTID source in the shard that runs it? (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationFlashbackCaptureWatermark_realGTIDSets_2085 ' /tmp/mysql-it.out \
            || { echo "FATAL: the capture watermark test over real GTID sets did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationSQLCompareGeneratedNames ' /tmp/mysql-it.out \
            || { echo "FATAL: read-routing generated-column names test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationFlashbackRoutedSessionFunction_2127 ' /tmp/mysql-it.out \
            || { echo "FATAL: read routing after a session change inside a stored function did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationSQLCompareTemporalColumns ' /tmp/mysql-it.out \
            || { echo "FATAL: read-routing date-column arithmetic test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationSQLCompareCopyWords ' /tmp/mysql-it.out \
            || { echo "FATAL: read-routing copy-reserved words test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationBinlogOrderRecoverAndReconstruct2156_mysql ' /tmp/mysql-it.out \
            || { echo "FATAL: the applied-recovery-script test over a real capture did not run: is binary logging on? (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationLatestPerKeyBinlogOrder2156_mysql ' /tmp/mysql-it.out \
            || { echo "FATAL: the verify and _snapshot latest-change test over a real capture did not run: is binary logging on? (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationLatestPerPKThreePlacesAgree2156 ' /tmp/mysql-it.out \
            || { echo "FATAL: the latest-per-key agreement test (MySQL, DuckDB, Go) did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestStreamLoop_unmappableRowReachesThePersistedLedger ' /tmp/mysql-it.out || { echo "FATAL: unmappable-row skip ledger test did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestRefresh_afterTheBinlogNumberingStartsOver_refusesUntilAFullSnapshot ' /tmp/mysql-it.out \
            || { echo "FATAL: the refresh after a binlog numbering that started over did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestRunReconstruct_atBeforeABinlogRenumbering_2182 ' /tmp/mysql-it.out \
            || { echo "FATAL: reconstruct --at before a binlog numbering that started over did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestSnapshot_afterTheBinlogNumberingStartsOver_2174 ' /tmp/mysql-it.out \
            || { echo "FATAL: _snapshot after a binlog numbering that started over did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestVerifyBaselinePair_afterTheBinlogNumberingStartsOver_2174 ' /tmp/mysql-it.out \
            || { echo "FATAL: verify after a binlog numbering that started over did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestIntegrationCopyUnchanged_numberingStartedOver_2160 ' /tmp/mysql-it.out \
            || { echo "FATAL: read routing after a binlog numbering that started over did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestCascade_afterTheBinlogNumberingStartsOver_2177 ' /tmp/mysql-it.out \
            || { echo "FATAL: cascade recovery after a binlog numbering that started over did not run (false-green tripwire)" >&2; exit 1; }
          grep -q -- '--- PASS: TestCheckNumberingContinues_2160 ' /tmp/mysql-it.out || { echo "FATAL: the binlog renumbering check did not run (false-green tripwire)" >&2; exit 1; }

      # The S3 tripwire, kept apart from the steps above so a store that did
      # not start is red even when every test passed.
      - name: S3-compatible leg
        if: ${{ !cancelled() && env.RUN == 'true' }}
        uses: ./.github/actions/s3-test-store-check
        with:
          ready: ${{ steps.s3store.outputs.ready }}
          test-log: /tmp/mysql-it.out

  integration-mariadb-source:
    # MariaDB-as-source beta. A MariaDB-source test pairs a NEW MariaDB SOURCE
    # container (13307) with the existing MySQL INDEX container (13306) — two
    # containers a single matrix cell of the `integration` job cannot host, and
    # bolting MariaDB into that job would also perturb the shared-binlog window
    # the parser count-assertions depend on (#415). So it gets its own job, and
    # the 8.0/8.4 matrix above stays byte-identical. Runs only the MariaDB-named
    # tests (-run); the MySQL-only MariaDB tests (sqlmock/index-side) also run in
    # the matrix job, where the live-replication test skips for lack of a source.
    needs: changes
    runs-on: ubuntu-22.04

    # Spans the supported MariaDB range (#622): 10.11 LTS (declared minimum,
    # 10.6 reached end of life on 2026-07-06) through the 11.4, 11.8 and 12.3
    # LTS releases. fail-fast: false so a regression on one version still
    # reports the others, matching the PostgreSQL matrix. No per-version
    # server args are needed: the `mariadb` client name, the
    # MARIADB_ROOT_PASSWORD image env, gtid_strict_mode, log_bin_compress and
    # the ON default of binlog_annotate_row_events hold on 10.11 and 11.4;
    # these legs are what prove it for 11.8 and 12.3. 12.3 runs with its
    # default file-based binlog: the opt-in binlog_storage_engine=innodb is
    # not supported (docs/mariadb.md). The minimum is also in
    # internal/doctor/mariadb_version.go, and release.yaml must list the same
    # versions (scripts/check-mariadb-matrix-lockstep.sh).
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.11", "11.4", "11.8", "12.3"]

    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      BINTRAIL_TEST_MARIADB_DSN: "root:testroot@tcp(127.0.0.1:13307)"
      # An empty MariaDB of the same version for `drill` to load into
      # (TestEndToEnd_MariaDBSnapshotChain). It has to be MariaDB: MySQL has
      # no UUID/INET column type.
      BINTRAIL_TEST_MARIADB_SCRATCH_DSN: "root:testroot@tcp(127.0.0.1:13309)"
      # A MariaDB source is guaranteed present in this job, so the MariaDB tests
      # must FAIL (not silently skip) if they can't run — otherwise a handshake
      # regression would pass as green-via-skip. The 8.0/8.4 matrix leaves this
      # unset, so the same tests skip politely there.
      BINTRAIL_REQUIRE_MARIADB: "1"
      # Data-path PRs only (plus push/nightly/dispatch). Step-level, not
      # job-level: this job has a matrix, and its cells are required
      # checks. See the note on the `changes` job.
      RUN: ${{ github.event_name != 'pull_request' || needs.changes.outputs.data == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version-file: go.mod

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start MariaDB source (bintrail-test-mariadb, ${{ matrix.mariadb }})
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-mariadb \
            -e MARIADB_ROOT_PASSWORD=testroot \
            -p 13307:3306 \
            mariadb:${{ matrix.mariadb }} \
            --log-bin=mariadb-bin --binlog-format=ROW --binlog-row-image=FULL \
            --server-id=2 --gtid-strict-mode=ON
          # Same socket-vs-TCP readiness race as the MySQL-start steps (#949):
          # probe host TCP with full auth + a real query, 3 consecutive
          # successes, instead of `docker exec ... mariadb-admin ping`.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mariadb:${{ matrix.mariadb }} \
                 mariadb --protocol=TCP -h 127.0.0.1 -P 13307 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MariaDB source is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready in time" >&2
          docker logs bintrail-test-mariadb >&2 || true
          exit 1

      # The drill target of the snapshot chain test: no binlog, nothing else
      # writes to it, and drill refuses it unless the schema it loads is absent.
      - name: Start MariaDB drill target (bintrail-test-mariadb-scratch, ${{ matrix.mariadb }})
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-mariadb-scratch \
            -e MARIADB_ROOT_PASSWORD=testroot \
            -p 13309:3306 \
            mariadb:${{ matrix.mariadb }}
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mariadb:${{ matrix.mariadb }} \
                 mariadb --protocol=TCP -h 127.0.0.1 -P 13309 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MariaDB drill target is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MariaDB drill target did not become ready in time" >&2
          docker logs bintrail-test-mariadb-scratch >&2 || true
          exit 1

      # The snapshot chain test runs a real mydumper. Same version the console
      # image bundles (#613) and the first-run walk installs. This jammy build
      # links the MySQL 8.0 client library, like the amd64 console image, so
      # TestEndToEnd_MariaDBSnapshotEd25519 checks the ed25519 limitation that
      # ships. The checksum is the release asset's own digest.
      - name: Install mydumper (1.0.3-1)
        if: env.RUN == 'true'
        run: |
          wget -q https://github.com/mydumper/mydumper/releases/download/v1.0.3-1/mydumper_1.0.3-1.jammy_amd64.deb -O /tmp/mydumper.deb
          echo "9f7fb46c03e1a721e86d71c42a3fe3bd88f1a7b0ec80fa91c7736826f7f1e6f4  /tmp/mydumper.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/mydumper.deb
          mydumper --version

      # -run selects the MariaDB-named tests across all packages; -p 1 serializes
      # so the shared binlog window stays single-writer (same rationale as the
      # MySQL integration job).
      #
      # Tests pick themselves by NAME here, so a rename, a build-tag drift or a
      # skip would drop them from this job and it would still exit 0. The
      # tripwire below asserts the key MariaDB-source tests actually PASSED
      # (-v prints the --- PASS lines; pipefail keeps go test's exit code
      # through the tee), the same guard the MySQL job carries.
      - name: MariaDB-source integration tests
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v -run 'MariaDB|Mariadb|mariadb|Flavor|FourColumns' ./... 2>&1 | tee /tmp/mariadb-it.out
          for name in \
            TestStreamLoop_liveReplication_mariadb \
            TestStreamLoop_mariadbResumeDedupDoesNotDeleteIndexedRows \
            TestOne_MariaDB_flavorDetectedWhenUndeclared \
            TestOne_MariaDB_declaredMySQLRefuses \
            TestOne_MariaDB_resumeOldMySQLDefaultCheckpoint \
            TestOne_MariaDB_freshCaptureStartsInGTIDMode \
            TestOne_MariaDB_explicitStartPosStaysPositionThenResetMovesToGTID \
            TestOne_MariaDB_reconnectAfterCommitIndexesOnce \
            TestOne_MariaDB_crashBeforeFirstFileCheckpointIndexesOnce \
            TestOne_MariaDB_resetKeepsOlderHistory \
            TestOne_MariaDB_cutMidTransactionIndexesOnce \
            TestOne_MariaDB_freshStartCheckpointsAtOnce \
            TestOne_MariaDB_resetMasterStopsWithResumeSteps \
            TestBYOSStream_MariaDBReconnectAfterCommitOnce \
            TestIntegrationMonitorRegistrySourceMariaDBDetected \
            TestIntegrationMonitorRegistrySourceMariaDBRelabeled \
            TestIntegrationWatchMariaDBSource \
            TestIntegrationFlashbackReadRoutingMariaDBSource \
            TestIntegrationFlashbackRoutedSessionFunctionMariaDB_2127 \
            TestIntegrationFlashbackRoutingLimitsMariaDBSource_2115 \
            TestIntegrationSQLCompareGeneratedNamesMariaDB \
            TestIntegrationSQLCompareTemporalColumnsMariaDB \
            TestIntegrationSQLCompareCopyWordsMariaDB \
            TestIntegrationSQLCompareBacktickNamesMariaDB \
            TestTakeSnapshot_pkLessVersionedTableRefused_mariadb \
            TestIntegrationReplicaCheckMariaDB \
            TestBuild_MariaDBVersionRow \
            TestBuild_MariaDBMinimalPrivilegeUser \
            TestBuild_MariaDBGrantRemediationWorks \
            TestQuery_MariaDBUUIDKeyEitherSpelling \
            TestQuery_MariaDBUUIDKeyWithoutSnapshotRefuses \
            TestRecover_MariaDBUUIDKeyTextSpelling \
            TestRecoverCascade_MariaDBUUIDKeyTextSpelling \
            TestIntegrationMariaDBUUIDKeyTextSpelling \
            TestTools_MariaDBUUIDKeyTextSpelling \
            TestRecoverRoundTrip_MariaDBTypes \
            TestRecoverRoundTrip_MariaDBUUIDKey \
            TestRecoverRoundTrip_MariaDBJSONText \
            TestRecoverSequence_MariaDB \
            TestConsistentTableChecksum_MariaDBGTIDBinlogPos \
            TestVerifyTable_liveSource_mariadb \
            TestVerifyTable_liveSource_mariadbIndexBehind \
            TestVerifyTable_liveSource_mariadbPositionMode \
            TestEndToEnd_MariaDBSnapshotChain \
            TestEndToEnd_MariaDBSnapshotEd25519 \
            TestFormatMariaDBFixed_matchesServer_MariaDB \
            TestDecodeEventBinaries_MariaDBFixedTypesRenderText \
            TestShimMariaDBUUIDKey \
            TestRunReconstruct_MariaDBUUIDKeyWithoutIndexTypesRefuses \
            TestIntegrationReconstruct_MariaDBUUIDKeyWithoutIndexTypesRefuses \
            TestIntegrationReconstructTool_MariaDBUUIDKeyWithoutIndexTypesRefuses \
            TestIntegrationBinlogOrderRecoverAndReconstruct2156_mariadb \
            TestIntegrationLatestPerKeyBinlogOrder2156_mariadb; do
            grep -q -- "--- PASS: $name " /tmp/mariadb-it.out \
              || { echo "FATAL: $name did not run and pass in the MariaDB-source job (false-green tripwire)" >&2; exit 1; }
          done

  integration-postgres-source:
    # PostgreSQL-as-source (#534). Like integration-mariadb-source, this pairs a
    # NEW PostgreSQL SOURCE container with the existing MySQL INDEX container
    # (13306): two containers a single `integration` matrix cell can't host, and
    # the PG logical-replication tests need wal_level=logical + replication slots
    # the MySQL index container can't provide. The end-to-end test
    # (TestOne_EndToEnd_PostgresToIndexToRecovery) streams PG changes INTO the
    # MySQL index and generates recovery SQL, so both servers must be present.
    needs: changes
    runs-on: ubuntu-22.04

    # Spans the supported PostgreSQL range: 14 (declared minimum — PG13 is EOL)
    # through 17. fail-fast: false so a regression on one version still reports
    # the others, matching the MySQL matrix. (PG18-specific stream changes — e.g.
    # STORED generated columns now in the WAL — are tracked with the beta work.)
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]

    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      # Host port 15432 (not 5432) avoids colliding with any PostgreSQL the
      # runner image ships; the container-internal port stays 5432. sslmode is
      # disabled — the stock postgres image serves plaintext. replDSN appends
      # replication=database onto this for the WAL connection.
      BINTRAIL_TEST_PG_DSN: "postgres://postgres:testpg@127.0.0.1:15432/pgtest?sslmode=disable"
      # A PostgreSQL source is guaranteed present here, so the PG tests must FAIL
      # (not silently skip) if the DSN is missing — guards against green-via-skip.
      # The 8.0/8.4 matrix and console-e2e leave it unset, so PG tests skip there.
      BINTRAIL_REQUIRE_POSTGRES: "1"
      # Data-path PRs only (plus push/nightly/dispatch); step-level because
      # of the matrix — see the note on the `changes` job.
      RUN: ${{ github.event_name != 'pull_request' || needs.changes.outputs.data == 'true' }}

    steps:
      # Step-level (not job-level) `if:` — see the note on the `integration`
      # job above; this job's matrix has the same requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version-file: go.mod

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start PostgreSQL source (bintrail-test-postgres, ${{ matrix.postgres }})
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-postgres \
            -e POSTGRES_PASSWORD=testpg \
            -e POSTGRES_DB=pgtest \
            -p 15432:5432 \
            postgres:${{ matrix.postgres }} \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          # Probe TCP from inside the container: during first-init the entrypoint
          # runs a temporary unix-socket-only server, so a TCP (-h 127.0.0.1)
          # pg_isready only succeeds once the REAL server is up — avoiding the
          # false-ready race a socket probe would hit.
          for i in $(seq 1 60); do
            if docker exec bintrail-test-postgres pg_isready -h 127.0.0.1 -U postgres -d pgtest --quiet 2>/dev/null; then
              echo "PostgreSQL source is ready."; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs bintrail-test-postgres >&2 || true
          exit 1

      # Scoped to the two PostgreSQL packages by path (not -run) so the selection
      # is naming-independent — it won't accidentally catch a future TestOne_*-
      # style test added elsewhere. -p 1 serializes (the tests share one server,
      # creating/dropping their own slots/publications).
      #
      # Both packages ALSO hold non-tagged unit tests, so a build-tag or path
      # drift that silently dropped the integration tests would still exit 0
      # green with ZERO PG coverage (the BINTRAIL_REQUIRE_POSTGRES guard only
      # fires when an integration test actually runs). Close that false-green by
      # asserting the headline end-to-end test genuinely ran — not merely that
      # `go test` exited 0. pipefail keeps the go-test exit code through the tee.
      - name: PostgreSQL-source integration tests
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v \
            ./internal/pgcapture/ ./internal/pgstreamrun/ ./internal/pgbaseline/ ./internal/pgshim/ 2>&1 | tee /tmp/pg-it.out
          grep -q -- '--- PASS: TestOne_EndToEnd_PostgresToIndexToRecovery' /tmp/pg-it.out \
            || { echo "FATAL: PG end-to-end integration test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestPGBaseline_Integration' /tmp/pg-it.out \
            || { echo "FATAL: pgbaseline integration suite did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestPGWire_PostgresSourceRoundTrip' /tmp/pg-it.out \
            || { echo "FATAL: pgwire PostgreSQL-source E2E did not run — false-green tripwire" >&2; exit 1; }

  integration-postgres-extensions:
    # Extension-type round-trip coverage (#1210): PostGIS geometry/geography
    # and pgvector's vector are text-decoded through pgoutput like any other
    # type, but the plain postgres:N images above cannot host the extensions —
    # so this job pairs the same MySQL index container with one extension-
    # bearing PostgreSQL image per cell (no single stock image ships both
    # extensions) and runs ONLY the extension matrix test; the full PG suite
    # already runs in integration-postgres-source. One modern PG major per
    # extension, not a full version matrix: the extension's text I/O is what's
    # under test, not the server version (that axis is covered above).
    #
    # BINTRAIL_REQUIRE_PGEXT names the extension each cell guarantees, turning
    # the test's per-extension skip into a FAILURE here — plus the usual
    # PASS-line tripwire, so a renamed test cannot go green-via-empty `-run`.
    needs: changes
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "postgis/postgis:16-3.4"
            ext: "postgis"
          - image: "pgvector/pgvector:pg16"
            ext: "vector"
    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      BINTRAIL_TEST_PG_DSN: "postgres://postgres:testpg@127.0.0.1:15432/pgtest?sslmode=disable"
      BINTRAIL_REQUIRE_POSTGRES: "1"
      BINTRAIL_REQUIRE_PGEXT: ${{ matrix.ext }}
      # Data-path PRs only (plus push/nightly/dispatch); step-level because
      # of the matrix — see the note on the `changes` job.
      RUN: ${{ github.event_name != 'pull_request' || needs.changes.outputs.data == 'true' }}
    steps:
      # Step-level (not job-level) `if:` — see the note on the `integration`
      # job above; this job's matrix has the same requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version-file: go.mod

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start PostgreSQL source (bintrail-test-postgres, ${{ matrix.image }})
        if: env.RUN == 'true'
        run: |
          docker run -d --name bintrail-test-postgres \
            -e POSTGRES_PASSWORD=testpg \
            -e POSTGRES_DB=pgtest \
            -p 15432:5432 \
            ${{ matrix.image }} \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          # Same in-container TCP probe as integration-postgres-source (the
          # postgis/pgvector images reuse the official postgres entrypoint,
          # first-init unix-socket-only phase included).
          for i in $(seq 1 60); do
            if docker exec bintrail-test-postgres pg_isready -h 127.0.0.1 -U postgres -d pgtest --quiet 2>/dev/null; then
              echo "PostgreSQL source is ready."; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs bintrail-test-postgres >&2 || true
          exit 1

      - name: Extension-type round-trip test (${{ matrix.ext }})
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v \
            -run 'TestOne_PGExtensionTypeRoundTripMatrix' ./internal/pgstreamrun/ 2>&1 | tee /tmp/pgext-it.out
          grep -q -- '--- PASS: TestOne_PGExtensionTypeRoundTripMatrix' /tmp/pgext-it.out \
            || { echo "FATAL: PG extension-type round-trip test did not run — false-green tripwire" >&2; exit 1; }

  console-e2e:
    # Headless-Chrome regression guard for the console SPA: go test never
    # renders assets/*, so CSS/DOM/presentation bugs (invisible buttons, a
    # form that auto-expands, a raw error wall, the control plane vanishing on
    # a broken server selection) are invisible to the Go suite. Each scenario
    # pins a bug that shipped in 0.13.3.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.console == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Same manually-named container as the integration job (8.4 = the bundled
      # index engine, caching_sha2_password default).
      - name: Start MySQL (bintrail-test-mysql, 8.4)
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # See the "integration" job's MySQL-start step for why this probes
          # host TCP with full auth + a real query, requiring 3 consecutive
          # successes, instead of `docker exec ... mysqladmin ping` (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Install playwright chromium (+ system deps)
        run: |
          npm --prefix test/console-e2e install --no-audit --no-fund
          npx --prefix test/console-e2e playwright install --with-deps chromium

      # PW_CHANNEL unset → use the chromium installed above (not system Chrome).
      - name: Console E2E (headless Chrome)
        run: make console-e2e

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-e2e-failure
          path: |
            ${{ runner.temp }}/console-e2e-failure.png
            ${{ runner.temp }}/console-e2e-daemon.log
          if-no-files-found: ignore

  console-first-run-walk:
    # The first-run walk (#1800): a person's first hour with DBTrail — sign in,
    # add the server, first change, Undo, first snapshot — driven in headless
    # Chrome against a fresh daemon and a STOCK mysql:8.4, and measured into a
    # scoreboard: clicks, fields typed, forced choices, trips out of the
    # browser, visible words per step, banned words, yellow or red elements,
    # changes seen without reloading, and how far the primary button sits below
    # the fold at 1280x720.
    #
    # It is a RATCHET, not a fixed expectation: the numbers today are the ones
    # in test/console-e2e/first_run_baseline.json, and this job fails when any
    # of them gets WORSE. Each onboarding slice lowers the baseline in its own
    # PR, so the scoreboard in the log is the evidence that slice worked.
    # FIRST_RUN_WALK_MODE=target compares with the targets instead; that is red
    # on main today, on purpose.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.console == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # The index server, the same manually-named 8.4 container the other jobs
      # use. The database the walk CAPTURES is a separate, stock mysql:8.4 that
      # the walk starts itself with no server flags at all — "zero yellow or
      # red on a stock MySQL" is only true if nothing here tunes it.
      - name: Start MySQL (bintrail-test-mysql, 8.4)
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            mysql:8.4 \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # Host TCP with full auth + a real query, three times in a row: see
          # the "integration" job's MySQL-start step for why (#949).
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host mysql:8.4 \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      # The first snapshot of the walk runs mydumper in-process, so the walk
      # needs it on PATH. Same version the console image bundles (#613), so
      # what CI exercises is what ships.
      - name: Install mydumper (1.0.3-1, the version the console image ships)
        run: |
          wget -q https://github.com/mydumper/mydumper/releases/download/v1.0.3-1/mydumper_1.0.3-1.jammy_amd64.deb -O /tmp/mydumper.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/mydumper.deb
          mydumper --version

      - name: Install playwright chromium (+ system deps)
        run: |
          npm --prefix test/console-e2e install --no-audit --no-fund
          npx --prefix test/console-e2e playwright install --with-deps chromium

      # No FIRST_RUN_WALK_ALLOW_SKIP here on purpose: everything the walk needs
      # is installed above, so a skip in CI (exit 77) must fail the job rather
      # than pass quietly.
      - name: First-run walk (scoreboard, ratcheted)
        run: make console-first-run-walk

      - name: Upload the scoreboard and what failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-run-walk
          path: |
            ${{ runner.temp }}/first-run-scoreboard.json
            ${{ runner.temp }}/first-run-walk-daemon.log
            ${{ runner.temp }}/first-run-walk-failure-*.png
          if-no-files-found: ignore

  # The build/.goreleaser.yaml signs block only ever executes on a tag push, so no
  # PR check can catch a broken flag set until a release run fails — the worst
  # possible moment (recovery is delete-tag, fix, re-tag; cosign v3 made the
  # Sigstore bundle sign-blob's default output, and an installer-action major
  # bump is what pulls a new cosign in). This job replays the EXACT cmd/args
  # from the config against a throwaway file, with the same keyless OIDC flow
  # and the same cosign-installer pin the release uses, then verifies the
  # bundle it produced. A cosign bump or a signs-block edit that would break
  # the release now fails here instead (#1350). Fork PRs carry no id-token,
  # so they skip rather than fail; pushes and same-repo PRs (dependabot
  # included) always run it. No `changes` gate on purpose: it must fire on
  # workflow/config-only PRs, which the go filter would skip.
  signing:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # keyless signing via OIDC, same as the release job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action pin determines which cosign BINARY ships (v4.x of the
      # action installs cosign v3.x) — which is why the lockstep check below
      # insists ci.yml and release.yaml carry the same SHA.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Replay the signs block against a throwaway artifact
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          # What CI proves must be what the release runs: same action pin.
          # Comment-enforced lockstep rots silently; this does not.
          ci_pin="$(grep -oE 'cosign-installer@[0-9a-f]{40}' .github/workflows/ci.yml | sort -u)"
          rel_pin="$(grep -oE 'cosign-installer@[0-9a-f]{40}' .github/workflows/release.yaml | sort -u)"
          if [ "$ci_pin" != "$rel_pin" ]; then
            echo "cosign-installer pins diverged: ci.yml has '$ci_pin', release.yaml has '$rel_pin'" >&2
            exit 1
          fi

          artifact="$(mktemp)"
          echo "signing probe ${GITHUB_SHA}" > "$artifact"

          cmd="$(yq -r '.signs[0].cmd' build/.goreleaser.yaml)"
          sig_tpl="$(yq -r '.signs[0].signature // "${artifact}.sig"' build/.goreleaser.yaml)"
          cert_tpl="$(yq -r '.signs[0].certificate // ""' build/.goreleaser.yaml)"
          args_raw="$(yq -r '.signs[0].args[]' build/.goreleaser.yaml)"

          # Fail closed on template forms this replay does not implement: the
          # renderer below knows exactly ${artifact}/${signature}/${certificate}.
          # A {{ }} goreleaser template or an unknown ${} placeholder would
          # otherwise reach cosign as literal bytes — a green proving the
          # wrong invocation. Teach the renderer first, then use the form.
          probe="$(printf '%s\n%s\n%s\n%s' "$cmd" "$sig_tpl" "$cert_tpl" "$args_raw")"
          probe="${probe//\$\{artifact\}/}"
          probe="${probe//\$\{signature\}/}"
          probe="${probe//\$\{certificate\}/}"
          case "$probe" in *'{{'*|*'${'*)
            echo "signs block uses template forms the CI replay cannot render — teach the replay first" >&2
            exit 1 ;;
          esac

          signature=""
          certificate=""
          render() {
            local s="$1"
            s="${s//\$\{artifact\}/$artifact}"
            s="${s//\$\{signature\}/$signature}"
            s="${s//\$\{certificate\}/$certificate}"
            printf '%s' "$s"
          }
          signature="$(render "$sig_tpl")"
          certificate="$(render "$cert_tpl")"
          args=()
          while IFS= read -r a; do args+=("$(render "$a")"); done <<< "$args_raw"
          echo "replaying: $cmd ${args[*]}"
          "$cmd" "${args[@]}"
          test -s "$signature" || { echo "signs block produced no signature at $signature" >&2; exit 1; }

          # This run's Fulcio identity is THIS workflow's ref (ci.yml@...), so
          # that is what the verify pins. The user-facing recipe in
          # docs/install.md pins release.yaml@refs/tags/ instead and is
          # exercised by nothing here — review it by hand when it changes.
          cosign verify-blob \
            --bundle "$signature" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$artifact"

  # ci.yml and release.yaml start and check the S3-compatible test store
  # through shared actions, and the image pin must match what the mirror
  # workflow copies (#1884). This job fails when either drifts, and when the
  # two files test different MariaDB versions. No `changes` gate on purpose:
  # a workflow-only PR is exactly the one that can drift.
  workflow-lockstep:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: S3 test store lockstep (ci.yml, release.yaml, mirror)
        run: bash scripts/check-s3-store-lockstep.sh
      - name: MariaDB matrix lockstep (ci.yml, release.yaml)
        run: bash scripts/check-mariadb-matrix-lockstep.sh
