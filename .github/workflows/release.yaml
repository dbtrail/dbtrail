name: Release

on:
  push:
    tags:
      - "v*"

# Default for every job: read-only. The write grants (contents/packages/
# id-token) live on the `release` job only — the sole job that publishes.
permissions:
  contents: read

# Where the test images come from: Google's mirror of Docker Hub, which asks
# for no account. Docker Hub itself limits pulls per address and per account,
# and on 2026-10-10 it refused them for hours although every job had logged
# in: 20 of 26 jobs failed, three runs in a row (#2299). Every `docker run`
# and `docker pull` in this file names its image under "${TEST_IMAGES}/";
# scripts/check-test-image-registry.sh fails CI when one does not.
#
# The `release` job below still reaches Docker Hub when it builds the product
# images (their `FROM debian` line, BuildKit, QEMU). That is a few pulls per
# release, not one per test job, and it is not covered by the check.
env:
  TEST_IMAGES: mirror.gcr.io

jobs:
  # --- Integration matrix, run against the TAGGED ref itself -----------------
  #
  # #950: release.yaml used to be gated on unit tests only (`go test ./...`,
  # no `-tags=integration`, no service containers). The corruption/data-loss
  # guards live in the integration suite (ci.yml), which only ran on PRs — and
  # because merges are `--admin` squashes, the post-squash tree that actually
  # gets tagged may never have been exercised by that matrix. These jobs
  # duplicate ci.yml's `integration` / `integration-mariadb-source` /
  # `integration-postgres-source` jobs (minus the PR-only `changes`-based
  # path-skip logic, which doesn't apply here — a release always runs the
  # full matrix regardless of which files changed) and run on the exact commit
  # the tag points at. The `release` job below `needs:` all three, so a red
  # integration run blocks GoReleaser from publishing.
  #
  # !!! KEEP IN SYNC WITH ci.yml !!!
  # This is a hand-maintained COPY, not a shared definition (a workflow_call
  # refactor was evaluated for #950 and rejected: reusable-workflow job names
  # are reported as "<caller job> / <called job>", which would rename the
  # `integration (8.0)` / `integration (8.4)` / etc. required-status-check
  # contexts that branch protection on `main` currently pins by exact string —
  # only a repo-admin settings change can accommodate that, so it was punted).
  # Concretely: the readiness probes below MUST use host-TCP + a real query
  # with 3 consecutive successes (NOT `docker exec ... mysqladmin/mariadb-admin
  # ping`, which answers over the container's local socket and can return
  # ready while the real server on the mapped host port is still starting or
  # mid-restart during first-init — see #949, commit 95bd02e, and the matching
  # comments in ci.yml's `integration` / `integration-mariadb-source` /
  # `integration-postgres-source` jobs for the full story). If ci.yml's
  # integration jobs change (readiness probes, env guards, tripwire test
  # names, matrix versions), port the change here too.
  #
  # The S3-compatible test store is the exception to the copy: both files
  # start and check it through the shared actions in .github/actions/, and
  # scripts/check-s3-store-lockstep.sh (the `workflow-lockstep` job in
  # ci.yml) fails CI when either file stops using them (#1884).
  # The MySQL integration suite, in the same three shards ci.yml runs it in,
  # from the same scripts: scripts/mysql-integration-shard.sh splits the
  # packages and collects the results, scripts/mysql-integration-key-tests.sh
  # holds the tests that must have passed. Each shard is its own runner with
  # its own MySQL and S3 store. It used to be ONE job per MySQL version
  # running every package in a row: 42 minutes on 8.0 against 14 for the
  # slowest shard, on the same commit, and it was the release's whole wait.
  # That copy had also drifted: it started no GTID source, so the tests that
  # need one skipped, and it checked 7 key tests where ci.yml checks them all.
  #
  # The steps are ci.yml's `integration-shard` job without its PR-only gate
  # (a release runs every cell). scripts/check-mysql-shard-lockstep.sh (the
  # `workflow-lockstep` job in ci.yml) fails CI when the two files stop
  # running the same shards through the same scripts.
  integration-mysql-shard:
    runs-on: ubuntu-22.04
    # A hung test must not hold a runner for the 6-hour default. The slowest
    # shard took about 12 minutes when this was written.
    timeout-minutes: 40

    # Two supported cells: the BYO contract floor (8.0) and the bundled index
    # engine (8.4, where mysql_native_password is disabled by default so every
    # connection authenticates with caching_sha2_password over the plaintext
    # network). Running the whole suite on 8.4 is what proves the native_password-
    # OFF default doesn't break the up→stream→query→shim pipeline; the focused
    # TestCachingSha2ColdAuthSeam additionally guards the cold full-auth path on
    # both cells. fail-fast: false so a regression on one version still reports
    # the other.
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
        # Must list 1..SHARD_COUNT of scripts/mysql-integration-shard.sh: the
        # script refuses a shard past its count, and the `integration` job
        # fails when a shard's result is missing.
        shard: [1, 2, 3]

    env:
      # Matches internal/testutil.DefaultDSN — set explicitly to mirror the
      # SaaS repo's `agent/` job and make the wiring obvious in logs.
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      # A MySQL server is guaranteed present in this job (started below), so
      # SkipIfNoMySQL must FAIL (not silently skip) on a dial/ping failure —
      # otherwise a DSN or build-tag drift would exit 0 green with ZERO
      # coverage of the flagship capture->index->query->recover pipeline.
      # Mirrors BINTRAIL_REQUIRE_MARIADB / BINTRAIL_REQUIRE_POSTGRES (#949).
      BINTRAIL_REQUIRE_MYSQL: "1"
      # This job's MySQL is its own, and its packages run one at a time, so a
      # test may change the server's GLOBAL time_zone and sql_mode (and put
      # them back): the read router's "source defaults" test needs it.
      BINTRAIL_TEST_ALLOW_SET_GLOBAL: "1"
      # The Iceberg export's integration leg reads its tables back with
      # DuckDB's iceberg extension; require it so the read-back never skips.
      BINTRAIL_REQUIRE_DUCKDB_ICEBERG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pulled ahead of the containers below, with three tries per image: a
      # registry that does not answer for a moment costs a retry here, where
      # the `docker run` that starts the server would fail the job at once.
      - name: Pull the test images
        run: |
          bash scripts/pull-test-images.sh \
            "${TEST_IMAGES}/library/mysql:${{ matrix.mysql }}"

      # Start MySQL as a manually-named container rather than a `services:`
      # block. The integration tests `docker cp` raw binlog files out of a
      # container named exactly `bintrail-test-mysql`, and they need ROW-format
      # binlogs with a known basename — neither of which a `services:` block can
      # provide (service containers get auto-generated names and can't take
      # command-line args). This mirrors the local setup in CONTRIBUTING.md so
      # CI and developer machines run against an identical container.
      - name: Start MySQL (bintrail-test-mysql, ${{ matrix.mysql }})
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            "${TEST_IMAGES}/library/mysql:${{ matrix.mysql }}" \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --log-bin=binlog \
            --server-id=1
          echo "Waiting for MySQL to accept connections..."
          # Probe over the SAME path the tests use — host TCP 127.0.0.1:13306
          # with full auth and a real query — NOT `docker exec ... mysqladmin
          # ping`, which answers over the container's local socket. The
          # official mysql image runs a TEMPORARY mysqld during first-init
          # (to create the root user / run init scripts), then shuts it down
          # and starts the real one; a socket-local ping can succeed against
          # that temporary server and exit this loop while the real server on
          # the mapped host port is still starting or mid-restart — the
          # readiness race behind #949's `integration (8.0)` failure
          # (TestEndToEnd_fullPipeline: "unexpected EOF" / "invalid
          # connection" dialing 127.0.0.1:13306). Requiring THREE consecutive
          # successful probes (not just one) rules out a probe that landed on
          # the temporary server moments before the restart. The probe runs
          # from a short-lived container on the SAME image tag as the server
          # so it doesn't depend on whatever mysql client (if any) happens to
          # be preinstalled on the runner.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEST_IMAGES}/library/mysql:${{ matrix.mysql }}" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                echo "MySQL is ready (3 consecutive successful probes)."
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      # A second MySQL, with GTIDs on, for the read-routing tests that need a
      # GTID source captured into an index on ANOTHER server (#2085): the
      # index of a source is never compared with it when both are one server,
      # and the main server above runs without GTIDs. Only in the shard that
      # runs the consoleapp TestIntegrationFlashback tests (SPLIT_RUN in
      # scripts/mysql-integration-shard.sh); if that split moves to another
      # shard, this step and the two variables below move with it, and the
      # `integration` job's "Key tests ran" step is what notices if they did
      # not (the tests skip without the server unless told it is required).
      - name: Start the GTID source (bintrail-test-mysql-gtid, ${{ matrix.mysql }})
        if: matrix.shard == 2
        run: |
          docker run -d --name bintrail-test-mysql-gtid \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13316:3306 \
            "${TEST_IMAGES}/library/mysql:${{ matrix.mysql }}" \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --log-bin=binlog \
            --server-id=3 \
            --gtid-mode=ON \
            --enforce-gtid-consistency=ON
          # Three consecutive answers over the path the tests use, for the
          # reason given at the main server's start above.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEST_IMAGES}/library/mysql:${{ matrix.mysql }}" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13316 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                echo "The GTID source is ready (3 consecutive successful probes)."
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "The GTID source did not become ready in time" >&2
          docker logs bintrail-test-mysql-gtid >&2 || true
          exit 1

      # An S3-compatible store for the #1453/#1454 leg: the SDK half uploads
      # through BINTRAIL_S3_ENDPOINT and the DuckDB half reads the object back
      # through the session's endpoint settings. The image, its pin and its
      # mirror live in .github/actions/s3-test-store (shared with
      # release.yaml). That action never fails: when the store cannot start
      # (the image was withdrawn twice in September 2026, #1884), the S3 tests
      # skip, every other test still runs, and the "S3-compatible leg" step
      # at the end turns this job red.
      - name: Start S3-compatible test store (bintrail-test-minio)
        id: s3store
        uses: ./.github/actions/s3-test-store

      # The shard's packages run one at a time against this job's MySQL: they
      # share one server-wide binlog, and running two at once lets one
      # package's DDL/DML leak into another's binlog window (the binlog parser
      # tests assert exact event counts). The script first builds the shard's
      # test binaries in parallel, which `go test -p 1` would build one by one.
      #
      # BINTRAIL_REQUIRE_MYSQL=1 (above) only catches a dial/ping failure INSIDE
      # a test that actually runs. That a shard's key tests really ran is
      # checked by the `integration` job, over every shard's log.
      - name: Integration tests (-tags=integration, shard ${{ matrix.shard }})
        id: tests
        env:
          BINTRAIL_TEST_MINIO_ENDPOINT: ${{ steps.s3store.outputs.endpoint }}
          BINTRAIL_TEST_MINIO_ACCESS_KEY: bintrail
          BINTRAIL_TEST_MINIO_SECRET_KEY: bintrail-it-secret
          # The GTID source started above, in the shard that has it. There a
          # test that needs it FAILS when it is missing instead of skipping.
          BINTRAIL_TEST_GTID_SOURCE_DSN: ${{ matrix.shard == 2 && 'root:testroot@tcp(127.0.0.1:13316)' || '' }}
          BINTRAIL_REQUIRE_GTID_SOURCE: ${{ matrix.shard == 2 && '1' || '' }}
        run: |
          mkdir -p /tmp/mysql-it-shard
          bash scripts/mysql-integration-shard.sh run ${{ matrix.shard }} /tmp/mysql-it-shard/mysql-it.out

      # What the `integration` job reads: this shard's test log, how its tests
      # step ended and whether its S3 store started. Written even when the
      # tests failed, so the collector can say which shard and why.
      - name: Record the shard result
        if: ${{ !cancelled() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          S3_READY: ${{ steps.s3store.outputs.ready }}
        run: |
          mkdir -p /tmp/mysql-it-shard
          touch /tmp/mysql-it-shard/mysql-it.out
          printf '%s\n' "$TESTS_OUTCOME" > /tmp/mysql-it-shard/outcome
          printf '%s\n' "${S3_READY:-false}" > /tmp/mysql-it-shard/s3-ready

      # The attempt is part of the name: a shard that runs again ("Re-run
      # failed jobs") uploads beside its earlier result instead of under the
      # same name, and the `integration` job reads the highest attempt of each
      # shard. Under one name it sometimes read the older result (#2299).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: mysql-it-${{ matrix.mysql }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: /tmp/mysql-it-shard/
          if-no-files-found: error
          retention-days: 7

  # `integration-mysql (8.0)` and `integration-mysql (8.4)`: what the `release`
  # job waits for. It runs no tests; it collects the shards of its MySQL
  # version and is green only when every shard ran and passed, then checks
  # the key tests and the S3 leg over all their logs together. `!cancelled()`
  # makes it report when a shard failed, which a plain `needs:` would turn
  # into "skipped"; a failed or skipped job here stops the release either way.
  integration-mysql:
    needs: integration-mysql-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mysql-it-${{ matrix.mysql }}-shard-*
          path: /tmp/mysql-it-shards

      # Every shard must have reported and passed. A missing result means the
      # shard was cancelled, crashed before writing it, or the matrix and
      # SHARD_COUNT disagree. A shard that ran more than once ("Re-run failed
      # jobs") left one result per attempt, and the newest is the one read.
      # Readiness of the S3 store is true only when it started in EVERY shard:
      # a shard whose store was down skipped its S3 tests. The rules, and
      # their tests: `collect` in scripts/mysql-integration-shard.sh and
      # scripts/test-mysql-integration-collect.sh.
      - name: Collect the shards (MySQL ${{ matrix.mysql }})
        id: s3store
        run: bash scripts/mysql-integration-shard.sh collect /tmp/mysql-it-shards "${{ matrix.mysql }}" /tmp/mysql-it.out

      # One package (consoleapp) runs in two shards, split by test name: one
      # shard runs the tests a pattern matches, another the rest. Over both
      # logs together, every test its binary lists must have run exactly
      # once, so a change to the split can neither drop a test nor run it
      # twice (scripts/mysql-integration-shard.sh, SPLIT_PKG).
      - name: The split package ran whole
        run: bash scripts/mysql-integration-shard.sh check-split /tmp/mysql-it.out

      # The false-green tripwires: these tests must have PASSED in some shard,
      # not merely not failed. They live in different shards, so they are
      # checked here over every shard's log.
      - name: Key tests ran
        run: bash scripts/mysql-integration-key-tests.sh /tmp/mysql-it.out

      # The S3 tripwire, kept apart from the steps above so a store that did
      # not start is red even when every test passed.
      - name: S3-compatible leg
        if: ${{ !cancelled() }}
        uses: ./.github/actions/s3-test-store-check
        with:
          ready: ${{ steps.s3store.outputs.ready }}
          test-log: /tmp/mysql-it.out

  integration-mariadb-source:
    # Mirrors ci.yml's `integration-mariadb-source` job. See that job's
    # comments for why MariaDB-as-source needs its own job (two containers,
    # a shared-binlog-window constraint the 8.0/8.4 matrix can't absorb).
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    # Same 10.11 / 11.4 / 11.8 / 12.3 LTS matrix as ci.yml (#622).
    # scripts/check-mariadb-matrix-lockstep.sh fails CI when the two differ.
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.11", "11.4", "11.8", "12.3"]

    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      BINTRAIL_TEST_MARIADB_DSN: "root:testroot@tcp(127.0.0.1:13307)"
      BINTRAIL_TEST_MARIADB_SCRATCH_DSN: "root:testroot@tcp(127.0.0.1:13309)"
      BINTRAIL_REQUIRE_MARIADB: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pulled ahead of the containers below, with three tries per image: a
      # registry that does not answer for a moment costs a retry here, where
      # the `docker run` that starts the server would fail the job at once.
      - name: Pull the test images
        run: |
          bash scripts/pull-test-images.sh \
            "${TEST_IMAGES}/library/mysql:8.4" \
            "${TEST_IMAGES}/library/mariadb:${{ matrix.mariadb }}"

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            "${TEST_IMAGES}/library/mysql:8.4" \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # Host-TCP probe, 3 consecutive successes — see the integration-mysql
          # job above / #949 for why `docker exec ... mysqladmin ping` races.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEST_IMAGES}/library/mysql:8.4" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start MariaDB source (bintrail-test-mariadb, ${{ matrix.mariadb }})
        run: |
          docker run -d --name bintrail-test-mariadb \
            -e MARIADB_ROOT_PASSWORD=testroot \
            -p 13307:3306 \
            "${TEST_IMAGES}/library/mariadb:${{ matrix.mariadb }}" \
            --log-bin=mariadb-bin --binlog-format=ROW --binlog-row-image=FULL \
            --server-id=2 --gtid-strict-mode=ON
          # Same socket-vs-TCP readiness race as the MySQL-start step (#949):
          # host-TCP probe with a real query, 3 consecutive successes.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEST_IMAGES}/library/mariadb:${{ matrix.mariadb }}" \
                 mariadb --protocol=TCP -h 127.0.0.1 -P 13307 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MariaDB source is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready in time" >&2
          docker logs bintrail-test-mariadb >&2 || true
          exit 1

      # Drill target and mydumper for the snapshot chain test; see the same
      # two steps in ci.yml.
      - name: Start MariaDB drill target (bintrail-test-mariadb-scratch, ${{ matrix.mariadb }})
        run: |
          docker run -d --name bintrail-test-mariadb-scratch \
            -e MARIADB_ROOT_PASSWORD=testroot \
            -p 13309:3306 \
            "${TEST_IMAGES}/library/mariadb:${{ matrix.mariadb }}"
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEST_IMAGES}/library/mariadb:${{ matrix.mariadb }}" \
                 mariadb --protocol=TCP -h 127.0.0.1 -P 13309 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MariaDB drill target is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MariaDB drill target did not become ready in time" >&2
          docker logs bintrail-test-mariadb-scratch >&2 || true
          exit 1

      - name: Install mydumper (1.0.3-1)
        run: |
          wget -q https://github.com/mydumper/mydumper/releases/download/v1.0.3-1/mydumper_1.0.3-1.jammy_amd64.deb -O /tmp/mydumper.deb
          echo "9f7fb46c03e1a721e86d71c42a3fe3bd88f1a7b0ec80fa91c7736826f7f1e6f4  /tmp/mydumper.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/mydumper.deb
          mydumper --version

      # Same PASS-line tripwire as ci.yml, for the tests this job must not skip.
      - name: MariaDB-source integration tests
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v -run 'MariaDB|Mariadb|mariadb|Flavor|FourColumns' ./... 2>&1 | tee /tmp/mariadb-it.out
          for name in \
            TestStreamLoop_liveReplication_mariadb \
            TestStreamLoop_mariadbResumeDedupDoesNotDeleteIndexedRows \
            TestOne_MariaDB_flavorDetectedWhenUndeclared \
            TestOne_MariaDB_declaredMySQLRefuses \
            TestOne_MariaDB_resumeOldMySQLDefaultCheckpoint \
            TestOne_MariaDB_freshCaptureStartsInGTIDMode \
            TestOne_MariaDB_explicitStartPosStaysPositionThenResetMovesToGTID \
            TestOne_MariaDB_reconnectAfterCommitIndexesOnce \
            TestOne_MariaDB_crashBeforeFirstFileCheckpointIndexesOnce \
            TestOne_MariaDB_resetKeepsOlderHistory \
            TestOne_MariaDB_cutMidTransactionIndexesOnce \
            TestOne_MariaDB_freshStartCheckpointsAtOnce \
            TestBYOSStream_MariaDBReconnectAfterCommitOnce \
            TestIntegrationMonitorRegistrySourceMariaDBDetected \
            TestIntegrationMonitorRegistrySourceMariaDBRelabeled \
            TestIntegrationWatchMariaDBSource \
            TestIntegrationReplicaCheckMariaDB \
            TestBuild_MariaDBVersionRow \
            TestBuild_MariaDBMinimalPrivilegeUser \
            TestBuild_MariaDBGrantRemediationWorks \
            TestQuery_MariaDBUUIDKeyEitherSpelling \
            TestQuery_MariaDBUUIDKeyWithoutSnapshotRefuses \
            TestRecover_MariaDBUUIDKeyTextSpelling \
            TestRecoverCascade_MariaDBUUIDKeyTextSpelling \
            TestIntegrationMariaDBUUIDKeyTextSpelling \
            TestTools_MariaDBUUIDKeyTextSpelling \
            TestRecoverRoundTrip_MariaDBTypes \
            TestRecoverRoundTrip_MariaDBUUIDKey \
            TestRecoverRoundTrip_MariaDBJSONText \
            TestRecoverSequence_MariaDB \
            TestConsistentTableChecksum_MariaDBGTIDBinlogPos \
            TestVerifyTable_liveSource_mariadb \
            TestVerifyTable_liveSource_mariadbIndexBehind \
            TestVerifyTable_liveSource_mariadbPositionMode \
            TestEndToEnd_MariaDBSnapshotChain \
            TestEndToEnd_MariaDBSnapshotEd25519 \
            TestFormatMariaDBFixed_matchesServer_MariaDB \
            TestDecodeEventBinaries_MariaDBFixedTypesRenderText \
            TestShimMariaDBUUIDKey \
            TestRunReconstruct_MariaDBUUIDKeyWithoutIndexTypesRefuses \
            TestIntegrationReconstruct_MariaDBUUIDKeyWithoutIndexTypesRefuses \
            TestIntegrationReconstructTool_MariaDBUUIDKeyWithoutIndexTypesRefuses; do
            grep -q -- "--- PASS: $name " /tmp/mariadb-it.out \
              || { echo "FATAL: $name did not run and pass in the MariaDB-source job (false-green tripwire)" >&2; exit 1; }
          done

  integration-postgres-source:
    # Mirrors ci.yml's `integration-postgres-source` job.
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    # Spans the supported PostgreSQL range: 14 (declared minimum) through 17.
    # fail-fast: false so a regression on one version still reports the others.
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]

    env:
      BINTRAIL_TEST_DSN: "root:testroot@tcp(127.0.0.1:13306)"
      BINTRAIL_TEST_PG_DSN: "postgres://postgres:testpg@127.0.0.1:15432/pgtest?sslmode=disable"
      BINTRAIL_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pulled ahead of the containers below, with three tries per image: a
      # registry that does not answer for a moment costs a retry here, where
      # the `docker run` that starts the server would fail the job at once.
      - name: Pull the test images
        run: |
          bash scripts/pull-test-images.sh \
            "${TEST_IMAGES}/library/mysql:8.4" \
            "${TEST_IMAGES}/library/postgres:${{ matrix.postgres }}"

      - name: Start MySQL index (bintrail-test-mysql, 8.4)
        run: |
          docker run -d --name bintrail-test-mysql \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -p 13306:3306 \
            "${TEST_IMAGES}/library/mysql:8.4" \
            --binlog-format=ROW --binlog-row-image=FULL --log-bin=binlog --server-id=1
          # Host-TCP probe, 3 consecutive successes — see integration-mysql
          # job above / #949 for why `docker exec ... mysqladmin ping` races.
          consecutive=0
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEST_IMAGES}/library/mysql:8.4" \
                 mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u root -ptestroot -e "SELECT 1" >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [ "$consecutive" -ge 3 ] && { echo "MySQL index is ready."; exit 0; }
            else
              consecutive=0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          docker logs bintrail-test-mysql >&2 || true
          exit 1

      - name: Start PostgreSQL source (bintrail-test-postgres, ${{ matrix.postgres }})
        run: |
          docker run -d --name bintrail-test-postgres \
            -e POSTGRES_PASSWORD=testpg \
            -e POSTGRES_DB=pgtest \
            -p 15432:5432 \
            "${TEST_IMAGES}/library/postgres:${{ matrix.postgres }}" \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10 -c track_commit_timestamp=on
          # Probe TCP from inside the container — see ci.yml's equivalent step
          # for why a socket-only pg_isready would false-ready during init.
          for i in $(seq 1 60); do
            if docker exec bintrail-test-postgres pg_isready -h 127.0.0.1 -U postgres -d pgtest --quiet 2>/dev/null; then
              echo "PostgreSQL source is ready."; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker logs bintrail-test-postgres >&2 || true
          exit 1

      # Same false-green tripwire as ci.yml: assert the headline end-to-end
      # tests genuinely ran, not merely that `go test` exited 0.
      - name: PostgreSQL-source integration tests
        run: |
          set -o pipefail
          go test -tags=integration -race -p 1 -count=1 -v \
            ./internal/pgcapture/ ./internal/pgstreamrun/ ./internal/pgbaseline/ ./internal/pgshim/ 2>&1 | tee /tmp/pg-it.out
          grep -q -- '--- PASS: TestOne_EndToEnd_PostgresToIndexToRecovery' /tmp/pg-it.out \
            || { echo "FATAL: PG end-to-end integration test did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestPGBaseline_Integration' /tmp/pg-it.out \
            || { echo "FATAL: pgbaseline integration suite did not run — false-green tripwire" >&2; exit 1; }
          grep -q -- '--- PASS: TestPGWire_PostgresSourceRoundTrip' /tmp/pg-it.out \
            || { echo "FATAL: pgwire PostgreSQL-source E2E did not run — false-green tripwire" >&2; exit 1; }

  release:
    needs: [integration-mysql, integration-mariadb-source, integration-postgres-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # create the GitHub release + upload assets
      packages: write   # push images to ghcr.io
      id-token: write   # cosign keyless signing via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # QEMU lets the amd64 runner execute the arm64 image's RUN layer
      # (apt-get + useradd) when GoReleaser builds linux/arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required by the build/.goreleaser.yaml signs/docker_signs/sboms blocks.
      # The signs block emits the Sigstore bundle (the cosign v3+ default;
      # #1350), and the ci.yml `signing` job replays those exact args against
      # this same action on every PR. The action pin determines which cosign
      # BINARY ships, so the two pins must stay in LOCKSTEP — the signing job
      # asserts that executably.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --config build/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
