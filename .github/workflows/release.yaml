name: Release

on:
  push:
    tags:
      - "v*"

# Default for every job: read-only. The write grants (contents/packages/
# id-token) live on the `release` job only — the sole job that publishes.
permissions:
  contents: read

jobs:
  # --- The tests a release waits for: main's CI on the same commit ---------
  #
  # A release used to run the whole integration suite again here (#950),
  # about 35 minutes, on a commit main's CI had just tested: ci.yml runs every
  # job and every version on a push to main, with no path skips, on the
  # squashed tree that gets tagged. So the release now WAITS for that run
  # instead of repeating it, and GoReleaser does not start unless it passed.
  #
  # Which run counts, in order:
  #   1. ci.yml on a push to main, on the tagged commit itself.
  #   2. The same on its parent, when the tagged commit only touches the
  #      changelog (docs/CHANGELOG.md, docs/changelog.d/): the release commit
  #      the release-oss steps make. That run is usually done already, so the
  #      release starts at once.
  #   3. Only for a tag whose message says "urgent": the CI of the pull
  #      request that made the commit (or its parent, as in 2). A pull request
  #      runs fewer versions than main, so this is a risk taken on purpose,
  #      for a release that cannot wait for main.
  # A run still going is waited for, up to 80 minutes, and so is a failed
  # one: re-running its failed jobs (a flaky test) turns it green and the
  # release goes on. No passing run after 80 minutes stops the release.
  main-ci-passed:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # The script below lives in the repository: without a checkout the
      # runner has no scripts/ and the job fails at once (v0.141.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the CI that tested this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-wait-for-ci.sh

  release:
    needs: [main-ci-passed]
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # create the GitHub release + upload assets
      packages: write   # push images to ghcr.io
      id-token: write   # cosign keyless signing via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # QEMU lets the amd64 runner execute the arm64 image's RUN layer
      # (apt-get + useradd) when GoReleaser builds linux/arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required by the build/.goreleaser.yaml signs/docker_signs/sboms blocks.
      # The signs block emits the Sigstore bundle (the cosign v3+ default;
      # #1350), and the ci.yml `signing` job replays those exact args against
      # this same action on every PR. The action pin determines which cosign
      # BINARY ships, so the two pins must stay in LOCKSTEP — the signing job
      # asserts that executably.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --config build/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
