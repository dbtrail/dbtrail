# Builds, tests and publishes the console base image
# (build/Dockerfile.console-base): Debian, mydumper and the bintrail user.
#
# The tag is the content of build/console-base.tag. It is not a release
# version: the base changes far less often than the console does.
#
# A published tag is never overwritten. When the tag in the file is already in
# the registry, the run still builds and tests both architectures and then
# skips the publish with a notice. To publish a change, bump the tag in the
# same change. On a pull request the `plan` job fails if the Dockerfile
# changed and the tag did not.
#
# Pull requests build and test both architectures and push nothing.
#
# Publish gate, same shape as demo-image.yml: each architecture is built on
# its native runner and pushed by digest, the `smoke` job runs
# build/smoke-console-base.sh against that digest on the same kind of runner,
# and only then `merge` creates the tag and signs it. A failed test leaves no
# tag behind.
#
# NOTE: like ghcr.io/dbtrail/bintrail, the bintrail-console-base package is
# created PRIVATE on first push and needs a one-time manual flip to public
# before an anonymous `docker pull` works (see docs/docker.md).
name: console-base-image

on:
  pull_request:
    paths:
      - build/Dockerfile.console-base
      - build/console-base.tag
      - build/console-base-tag-state.sh
      - build/smoke-console-base.sh
      - .github/workflows/console-base-image.yml
  push:
    branches: [main]
    paths:
      - build/Dockerfile.console-base
      - build/console-base.tag
      - build/console-base-tag-state.sh
      - build/smoke-console-base.sh
      - .github/workflows/console-base-image.yml
  workflow_dispatch:

# One publishing run at a time, and never cancelled halfway: two runs that
# both saw the tag as absent must not both publish it. Pull request runs only
# build and test, so a newer push to the same pull request replaces the older
# run.
concurrency:
  group: console-base-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default for every job: read-only. packages:write lives on the two jobs that
# push to ghcr.io; id-token:write only on `merge`, which cosign-signs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/dbtrail/bintrail-console-base

jobs:
  # Reads the tag and decides whether this run publishes.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # ask ghcr.io whether the tag is already there
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: on a pull request the checkout is the merge commit,
          # and its first parent is the base branch.
          fetch-depth: 2

      - id: tag
        name: Read the tag
        run: |
          set -euo pipefail
          [ -f build/console-base.tag ] || { echo "::error::build/console-base.tag is missing"; exit 1; }
          lines="$(grep -c '' build/console-base.tag)"
          [ "$lines" -eq 1 ] || { echo "::error::build/console-base.tag must hold exactly one line, it holds $lines"; exit 1; }
          TAG="$(cat build/console-base.tag)"
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9._-]{0,100}$ ]] || { echo "::error::build/console-base.tag holds '$TAG', which is not a valid image tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag: $TAG"

      - name: A changed Dockerfile needs a new tag
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # The merge commit has two parents. Anything else means the diff
          # below would compare the wrong trees.
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          [ "$parents" -eq 3 ] || { echo "::error::expected a merge commit with two parents, HEAD has $((parents - 1))"; exit 1; }
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "changed files:"
          echo "$changed"
          if grep -qxF 'build/Dockerfile.console-base' <<< "$changed" \
            && ! grep -qxF 'build/console-base.tag' <<< "$changed"; then
            echo "::error::build/Dockerfile.console-base changed and build/console-base.tag did not. Bump the tag in build/console-base.tag: a published tag is never overwritten, so this change would never be published."
            exit 1
          fi

      - id: decide
        name: Decide whether to publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request: both architectures are built and tested, nothing is pushed."
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Run on $GITHUB_REF, not on main: both architectures are built and tested, nothing is pushed."
            exit 0
          fi
          state="$(build/console-base-tag-state.sh "$IMAGE" "$TAG")"
          case "$state" in
            absent)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${IMAGE}:${TAG} is not published yet. This run publishes it if both architectures pass."
              ;;
            exists)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::warning::${IMAGE}:${TAG} is already published and is never overwritten. This run builds and tests, and skips the publish. To publish a change, bump build/console-base.tag."
              ;;
            *)
              echo "::error::unexpected tag state '$state'"
              exit 1
              ;;
          esac

  # The path that pushes nothing: pull requests, runs off main, and runs whose
  # tag is already published. Builds on the native runner, loads the image
  # into the local docker and tests it there.
  test:
    needs: plan
    if: needs.plan.outputs.publish == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          file: build/Dockerfile.console-base
          platforms: ${{ matrix.platform }}
          load: true
          tags: bintrail-console-base:ci
          # A loaded image is a single manifest; attestations would make it
          # an index, which the local docker store cannot load.
          provenance: false
          sbom: false

      - name: Test the image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: IMAGE=bintrail-console-base:ci build/smoke-console-base.sh

  # Build each arch on its OWN native runner and push a tagless image BY
  # DIGEST; the `merge` job stitches the digests into one multi-arch manifest
  # list. (Docker's documented multi-runner pattern.)
  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push per-arch images by digest to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `smoke` job's matrix: `merge` publishes EVERY
        # digest artifact (pattern: digests-*), but only the platforms listed
        # THERE get tested. An arch added here alone would ship untested.
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          file: build/Dockerfile.console-base
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push by digest only (no tag here); the merge job applies the tag.
          # SBOM + provenance attestations make each per-arch push a small
          # OCI index: the arch image plus attestation manifests (platform
          # "unknown/unknown"). `docker run` resolves the native-arch image
          # from that index, so the smoke job tests the exact pushed bytes.
          # mode=min keeps build args and env out of the provenance statement.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Guard against an empty/malformed build output silently producing
          # a bad artifact filename that would poison the merge.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected build digest: '$DIGEST'"; exit 1; }
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Test each arch's pushed digest on its NATIVE runner before anything is
  # tagged or signed. Same script the pull request runs, so there is one copy
  # of the checks.
  smoke:
    runs-on: ${{ matrix.runner }}
    needs: build
    # The script bounds its own waits, but the ghcr pull and the docker runs
    # do not. Without this a hung pull holds the publish for the 6h default.
    timeout-minutes: 20
    permissions:
      contents: read # checkout: the smoke script and the Dockerfile it reads the pin from
      packages: read # pull the per-arch image by digest from ghcr.io
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `build` job's matrix. An arch built but not
        # listed here would be published by `merge` without being tested.
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This leg's digest travels as the artifact's FILENAME (see the build
      # job's "Export digest"). download-artifact fails loudly if the named
      # artifact is missing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test the pushed digest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # failglob: an empty digests dir aborts here (same guard as the
          # merge job) instead of testing a bogus ref.
          shopt -s failglob
          files=("${{ runner.temp }}/digests"/*)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one digest file, got ${#files[@]}: ${files[*]}"; exit 1; }
          DIGEST="sha256:$(basename "${files[0]}")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: '$DIGEST'"; exit 1; }
          # The EXACT bytes the build leg pushed: `docker run` pulls the
          # digest ref on its own.
          IMAGE="${IMAGE}@${DIGEST}" build/smoke-console-base.sh

  merge:
    runs-on: ubuntu-22.04
    # smoke: no tag, no signature, unless both arches passed the test.
    needs: [plan, build, smoke]
    timeout-minutes: 15
    permissions:
      contents: read # checkout: build/console-base-tag-state.sh
      packages: write # push the merged manifest list to ghcr.io
      id-token: write # cosign keyless signing via GitHub OIDC
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: The tag must still be absent
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9._-]{0,100}$ ]] || { echo "::error::unexpected tag '$TAG'"; exit 1; }
          # `plan` asked the same question minutes ago. Asked again here, right
          # before the only step that can write the tag.
          state="$(build/console-base-tag-state.sh "$IMAGE" "$TAG")"
          [ "$state" = "absent" ] || { echo "::error::${IMAGE}:${TAG} is '$state' now. A published tag is never overwritten."; exit 1; }

      - name: Create multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # failglob: an empty digests dir aborts here instead of passing a
          # literal `*` to imagetools as a bogus source ref.
          shopt -s failglob
          # Intentional word-splitting: expand to multiple image@digest args
          # (Docker's documented merge idiom).
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect, verify both arches, and sign
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          # The published index MUST carry both arches. A partial build (one
          # matrix leg's digest missing) would otherwise tag and sign a
          # single-arch manifest green. BuildKit attestation manifests also
          # appear here as "unknown/unknown" entries; the check below only
          # requires the two real arches to be present.
          PLATFORMS=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "manifest platforms: ${PLATFORMS}"
          for want in linux/amd64 linux/arm64; do
            case " ${PLATFORMS} " in *" ${want} "*) ;; *) echo "published manifest is missing ${want}"; exit 1 ;; esac
          done
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected index digest: '$DIGEST'"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"
